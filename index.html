  function runTestSuite() {
    var cases = buildTestCases();
    var results = [], pass = 0, t0 = Date.now();
    cases.forEach(function (c) {
      var res = null, ok = false, detail = '';
      try {
        res = PY.run(c.code, { vfs: {}, stdin: c.stdin || [] });
        var r = c.check(res);
        ok = (r === true);
        if (!ok) detail = String(r);
      } catch (e) { detail = '抛出未捕获异常:' + e.message; }
      if (ok) pass++;
      results.push({ name: c.name, ok: ok, detail: detail, steps: res ? res.steps : 0 });
    });
    return { total: cases.length, pass: pass, fail: cases.length - pass,
             ms: Date.now() - t0, results: results };
  }
  function renderTestPanel(sum) {
    var rows = '';
    sum.results.forEach(function (r) {
      rows += '<div class="testRow ' + (r.ok ? 'pass' : 'fail') + '">' +
        '<span class="tag">' + (r.ok ? 'PASS' : 'FAIL') + '</span>' +
        '<span class="nm">' + esc(r.name) + '</span>' +
        (r.ok ? '<span class="dt">' + r.steps + '步</span>' : '') +
        '</div>';
      if (!r.ok) rows += '<div style="font-family:var(--mono);font-size:11px;color:var(--err);margin:-2px 0 8px 12px"> ' +
        esc(r.detail) + '</div>';
    });
    $('testBody').innerHTML =
      '<div id="testSummary">' +
        '<span class="bigNum" style="color:' + (sum.fail === 0 ? 'var(--ok)' : 'var(--err)') + '">' +
          sum.pass + ' / ' + sum.total + '</span>' +
        '<span style="color:var(--ink-soft)"> 通过 · ' + Math.round(sum.pass / sum.total * 100) +
        '% · ' + sum.ms + ' ms</span></div>' + rows;
    $('testPill').textContent = sum.pass + '/' + sum.total + (sum.fail === 0 ? ' ✓' : '[!]');
    $('testPill').className = 'pill' + (sum.fail === 0 ? ' okP' : '');
  }
  function runSelfTest() {
    var sum = runTestSuite();
    renderTestPanel(sum);
    $('ovTest').classList.add('show');
    return sum;
  }

  /* ---------- 事件绑定 ---------- */
  function bind() {
    $('code').addEventListener('input', function () {
      state.editCode = $('code').value;
      state.dirty = true;
      updateLineNums();
    });
    $('code').addEventListener('keydown', function (e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        var el = $('code'), s = el.selectionStart, t = el.value;
        el.value = t.slice(0, s) + '    ' + t.slice(el.selectionEnd);
        el.selectionStart = el.selectionEnd = s + 4;
        updateLineNums();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doRun(); }
    });
    $('btnRun').onclick = function () { stopAuto(); doRun(); };
    $('btnStep').onclick = function () { stopAuto(); stepNext(); };
    $('btnAuto').onclick = function () { toggleAuto(); };
    $('btnReset2').onclick = function () {
      state.dirty = false; state.editCode = undefined;
      $('code').value = ALL_LEVELS[state.cur].code || '';
      updateLineNums(); clearOut('已还原为本幕示范代码。');
      state.steps = []; state.stepIdx = 0; state.outLines = [];
      BE.byLine = {}; BE.guess = {}; state.curLine = null;
      renderBirdsEye(); renderViz(null);
      $('stepPill').textContent = '0 / 0';
    };
    $('btnHint').onclick = function () {
      var lv = ALL_LEVELS[state.cur];
      toast('提示:' + (lv.tasks && lv.tasks[0] ? lv.tasks[0] : '先执行一次,再打开「图示」看执行过程'));
    };
    // 逐行留痕(顶栏与浮动按钮共用)
    function toggleBirds() {
      BE.on = !BE.on;
      syncBirdsBtn();
      if (BE.on && !state.steps.length) doRun();
      renderBirdsEye();
      toast(BE.on ? '逐行留痕已开启:代码每行右侧显示该行执行时的变量值,「?」可点着猜输出'
                  : '逐行留痕已关闭');
    }
    $('btnBirdsTop').onclick = toggleBirds;
    if ($('btnBirds')) $('btnBirds').onclick = toggleBirds;
    $('code').addEventListener('scroll', function () {
      var be = $('birdsEye');
      if (be && BE.on) be.scrollTop = $('code').scrollTop;
      closeGuess();
    });
    window.addEventListener('resize', function () { closeGuess(); if (BE.on) renderBirdsEye(); });
    Array.prototype.forEach.call(document.querySelectorAll('.rtab'), function (t) {
      t.onclick = function () { switchTab(t.dataset.pane); };
    });
    $('btnCheat').onclick = openCheat;
  var gb = $('btnGraph'); if (gb) gb.onclick = openGraph;
    $('btnTest').onclick = runSelfTest;
    $('btnReplay').onclick = function () {
      try { sessionStorage.removeItem('pyArchive.booted'); } catch (e) {}
      location.reload();
    };
    $('btnReset').onclick = function () {
      if (!confirm('确定要清空所有学习进度和答题记录吗?')) return;
      PROG = { done: {}, quiz: {} };
      saveProgress(PROG);
      renderNav(); renderProgress(); renderCenter(); renderEditor();
      toast('进度已重置');
    };
    // 开场封面点某一幕时,跳转到对应关卡
    window.addEventListener('py-archive:jump', function (e) {
      var idx = e && e.detail ? e.detail.act : -1;
      if (typeof idx === 'number' && idx >= 0 && idx < ALL_LEVELS.length) {
        try { goLevel(idx); } catch (err) {}
      }
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) {
      b.onclick = function () { $(b.dataset.close).classList.remove('show'); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('.overlay'), function (o) {
      o.onclick = function (e) { if (e.target === o) o.classList.remove('show'); };
    });
    document.addEventListener('click', function (e) {
      if (!guessPop) return;
      if (guessPop.contains(e.target)) return;
      if (e.target.classList && e.target.classList.contains('beGuess')) return;
      closeGuess();
    }, true);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeGuess();
        Array.prototype.forEach.call(document.querySelectorAll('.overlay.show'), function (o) {
          o.classList.remove('show');
        });
      }
      if (e.key === '?' && !/input|textarea/i.test(document.activeElement.tagName)) {
        e.preventDefault(); openCheat();
      }
    });
  }

  /* ---------- 启动 ---------- */
  function boot() {
    var need = ['nav', 'center', 'code', 'out', 'stageInner', 'btnRun', 'btnTest',
      'progMeta', 'slats', 'quizList', 'birdsEye', 'vizCtrl'];
    var missing = [];
    for (var i = 0; i < need.length; i++) if (!$(need[i])) missing.push(need[i]);
    if (missing.length) {
      throw new Error('页面缺少关键元素:' + missing.join('、') +
        '\nHTML 结构可能被截断。请重新获取完整的 HTML 文件。');
    }
    bind();
    // 把页面里以 text/plain 承载的源码灌进虚拟文件系统(如 minialgo.py)
    presetVirtualFiles();
    var first = 0;
    for (var k = 0; k < ALL_LEVELS.length; k++) {
      if (!PROG.done[ALL_LEVELS[k].id]) { first = k; break; }
      first = k;
    }
    goLevel(first);
    renderProgress();
    var probe = PY.run('print(1 + 1)', { vfs: {}, stdin: [] });
    if (probe.error || probe.stdout.join('') !== '2') {
      toast('解释器自检未通过,请打开「引擎自测」查看详情', 'err');
    }
    // 告诉开场:工作面已就绪,可以揭幕了
    try { if (window.__BOOT__ && window.__BOOT__.markReady) window.__BOOT__.markReady(); } catch (e) {}
    // 把档案编号显示出来(与开场呼应)
    try {
      var id = localStorage.getItem('pyArchive.id');
      if (id && $('sbMid')) $('sbMid').textContent = 'ARCHIVE ID ' + id + ' · PY ENGINE INLINE · OFFLINE';
    } catch (e) {}
  }


  /* ===== 以下为图示渲染器 / 逐行留痕 / 预测模式(与本作用域共享 $ / esc / state / BE)===== */
/* ==========================================================================
   图示渲染器 + 逐行留痕 + 预测模式
   —— 由 tools/port-renderers.node.js 从已验证的旧版 UI 原样搬运,请勿手改。
   依赖:state / ANIM / PY / $ / esc 这些与旧版同名的接口。
   ========================================================================== */

var BE = {
    on: false,
    byLine: {},       // { 行号: 该行最后一次执行时的 trace 帧 }
    guess: {},        // { 行号: {correct:bool, chosen:idx} } 行内预测结果
    lh: 21           // 每行高度(由 textarea 的实际行高动态测得)
  };

var guessPop = null;


  function renderVarsViz(host, st, prevVars) {
    host.innerHTML = '';
    var top = document.createElement('div');
    top.style.cssText = 'font-size:12px;color:var(--acc);font-family:var(--mono);margin-bottom:9px';
    top.innerHTML = '执行到第 ' + st.line + '行 <span style="color:var(--fg3)">|</span> ' +
      '<span style="color:var(--fg2)">' + esc(st.src || '') + '</span>';
    host.appendChild(top);
    if (st.stack && st.stack.length) {
      var sh = document.createElement('div');
      sh.style.cssText = 'margin-bottom:9px';
      host.appendChild(sh);
      ANIM.renderStack(sh, st.stack);
    }
    var wrap = document.createElement('div');
    wrap.className = 'varGrid';
    host.appendChild(wrap);
    ANIM.renderVars(wrap, st.vars, prevVars);
    if (!Object.keys(st.vars).length) {
      wrap.innerHTML = '<div style="color:var(--fg3);font-size:12px">这一步还没有变量。</div>';
    }
  }

  function evalInContext(expr, vars) {
    var pre = '';
    Object.keys(vars || {}).forEach(function (k) {
      if (!/^[A-Za-z_]\w*$/.test(k)) return;
      pre += k + ' = ' + toPy(vars[k]) + '\n';
    });
    var res = PY.run(pre + '__ans = ' + expr, { vfs: {}, stdin: [] });
    if (res.error) return null;
    return lastVar(res, '__ans');
  }


  function renderStringViz(host, st) {
    var vars = st.vars || {};
    head(host, '变量盒子 + f-string 模板填充', '(第 ' + st.line + '行)');
    var wrap = document.createElement('div');
    wrap.className = 'varGrid';
    wrap.style.marginBottom = '12px';
    host.appendChild(wrap);
    ANIM.renderVars(wrap, vars, state.prevVars);

    var box = document.createElement('div');
    box.className = 'loopBox';
    var src = st.src || '';
    var m = /f(["'])(.+?)\1/.exec(src);
    if (!m) {
      box.innerHTML = '<div style="color:var(--fg3);font-size:12.5px">这一步不是 f-string 语句。' +
        '点「下一步 >」走到形如 <code>print(f"你好{name}")</code> 的那一行,就能看到槽位被填充的过程。</div>';
      host.appendChild(box);
      return;
    }
    var tpl = m[2];
    var slots = [];
    var framed = '', idx = 0;
    while (idx < tpl.length) {
      if (tpl.charAt(idx) === '{') {
        var end = tpl.indexOf('}', idx);
        if (end < 0) { framed += esc(tpl.slice(idx)); break; }
        var expr = tpl.slice(idx + 1, end);
        var val = evalInContext(expr, vars);
        slots.push({ expr: expr, val: val });
        framed += '<span style="display:inline-block;border:1px dashed var(--acc);border-radius:6px;' +
          'padding:1px 7px;color:var(--acc);background:rgba(255,212,59,.08)">{' + esc(expr) + '}</span>';
        idx = end + 1;
      } else { framed += esc(tpl.charAt(idx)); idx++; }
    }
    var result;
    var rf = evalInContext('f"' + tpl.replace(/"/g, '\\"') + '"', vars);
    result = rf === null ? null : PY.repr(rf);

    var h = '<div style="font-family:var(--mono);font-size:13px;line-height:2">' +
      '<div style="color:var(--fg3);font-size:11px;margin-bottom:6px">① 模板(带槽位)</div>' +
      '<div>' + framed + '</div>' +
      '<div style="color:var(--fg3);font-size:11px;margin:12px 0 6px">② 每个槽位当前的值</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">';
    slots.forEach(function (s) {
      h += '<span style="font-size:12px;padding:4px 10px;border-radius:8px;background:var(--panel2);' +
        'border:1px solid var(--line2)">{' + esc(s.expr) + '} = <b style="color:var(--acc)">' +
        esc(s.val === null ? '(还求不出值)' : PY.repr(s.val)) + '</b></span>';
    });
    if (!slots.length) h += '<span style="color:var(--fg3);font-size:12px">这一步的 f-string 里没有 {} 槽位。</span>';
    h += '</div>' +
      '<div style="color:var(--fg3);font-size:11px;margin:12px 0 6px">③ 填充后的最终字符串</div>' +
      '<div style="background:#090d12;border:1px solid var(--line);border-radius:8px;padding:8px 11px">' +
      (result === null ? '<span style="color:var(--fg3)">(等所有变量都有了值就能算出来)</span>' : esc(result)) +
      '</div></div>';
    box.innerHTML = h;
    host.appendChild(box);
  }

  function lastVar(res, name) {
    for (var i = res.trace.length - 1; i >= 0; i--) {
      if (name in res.trace[i].vars) return res.trace[i].vars[name];
    }
    return '?';
  }


  function renderConditionViz(host, st) {
    var vars = st.vars || {};
    head(host, '条件判断:岔路口', '(第 ' + st.line + '行)');
    var src = (st.src || '').trim();
    var wrap = document.createElement('div');
    wrap.className = 'varGrid';
    wrap.style.marginBottom = '12px';
    host.appendChild(wrap);
    ANIM.renderVars(wrap, vars, state.prevVars);

    var nodes = [];
    var m = /^(if|elif)\s+(.+?):\s*$/.exec(src);
    if (m) {
      var expr = m[2];
      var cv = evalInContext(expr, vars);
      var known = cv !== null;
      var isTrue = known && PY.typeName(cv) !== 'bool' ? truthyOf(cv) : cv === true;
      var label = known ? (cv === true ? 'True ' : cv === false ? 'False ' : PY.repr(cv)) : '(变量还没齐)';
      nodes.push({ tag: m[1] + '条件', text: expr });
      nodes.push({ tag: '求值结果', text: label, state: known ? (isTrue ? 'true' : 'false') : '' });
      nodes.push({ tag: isTrue ? '走向' : '走向', text: isTrue ? '执行缩进代码块 ->' : '跳到 elif / else ->' });
    } else if (/^else\s*:/.test(src)) {
      nodes.push({ tag: 'else', text: '前面条件都不成立,走这里' });
    } else if (/^elif/.test(src)) {
      nodes.push({ tag: 'elif', text: src.replace(/:$/, '') });
    } else {
      nodes.push({ tag: '当前执行', text: src.slice(0, 34) || '…' });
    }
    var fh = document.createElement('div');
    host.appendChild(fh);
    ANIM.renderFlow(fh, nodes, nodes.length > 1 ? 1 : 0);
  }

  function truthyOf(v) {
    if (v === null) return false;
    if (typeof v === 'boolean') return v;
    if (typeof v === 'number') return v !== 0;
    if (typeof v === 'string') return v.length > 0;
    if (Array.isArray(v)) return v.length > 0;
    if (v && v.__kind === 'dict') return Object.keys(v.map).length > 0;
    return true;
  }


  function renderLoopViz(host, vars, st) {
    head(host, '循环状态机', '(第 ' + st.line + '行)');
    var src = (st.src || '').trim();
    var wrap = document.createElement('div');
    wrap.className = 'varGrid';
    wrap.style.marginBottom = '12px';
    host.appendChild(wrap);
    ANIM.renderVars(wrap, vars, state.prevVars);

    var lh = document.createElement('div');
    host.appendChild(lh);

    var mRange = /^for\s+(\w+)\s+in\s+range\(([^)]*)\)/.exec(src);
    var mList = /^for\s+(\w+)\s+in\s+([A-Za-z_]\w*)\s*:/.exec(src);
    var mWhile = /^while\s+(.+?):/.exec(src);

    // 已走过的历史步骤(用于点亮)
    var hist = state.steps.slice(0, state.stepIdx + 1);

    if (mRange) {
      var parts = mRange[2].split(',').map(function (x) { return parseInt(x.trim(), 10); });
      if (parts.some(isNaN)) { fallback(); return; }
      var start = parts.length > 1 ? parts[0] : 0;
      var stop = parts.length > 1 ? parts[1] : parts[0];
      var step = parts.length > 2 ? parts[2] : 1;
      var vals = [];
      for (var v = start; step > 0 ? v < stop : v > stop; v += step) vals.push(v);
      if (vals.length > 60) vals = vals.slice(0, 60);
      var varName = mRange[1];
      var cur = vars[varName];
      var visited = {};
      hist.forEach(function (s) {
        var sv = s.vars[varName];
        if (typeof sv === 'number' && vals.indexOf(sv) >= 0) visited[sv] = 1;
      });
      ANIM.renderLoop(lh, {
        varName: varName, values: vals, visited: visited,
        current: typeof cur === 'number' ? cur : undefined
      });
      note('格子里的数字是 <b>' + esc(varName) + '</b> 依次取到的值;黄色是当前这一次,蓝色是已经走过的。');
      return;
    }

    if (mList) {
      var arrName = mList[2], elVar = mList[1];
      var arr = vars[arrName];
      if (Array.isArray(arr)) {
        var box = document.createElement('div');
        box.className = 'loopBox';
        var seen = [];
        hist.forEach(function (s) {
          var sv = s.vars[elVar];
          if (sv !== undefined && seen.length < 80) seen.push(PY.repr(sv));
        });
        var box2 = document.createElement('div');
        box.appendChild(box2);
        var cap = document.createElement('div');
        cap.style.cssText = 'font-size:11.5px;color:var(--fg3);margin:9px 0 5px';
        cap.textContent = '正在遍历 ' + arrName + '(共 ' + arr.length + '个元素):';
        box.appendChild(cap);
        var lw = document.createElement('div');
        box.appendChild(lw);
        var hitIdx = -1;
        var curVal = vars[elVar];
        for (var ai = 0; ai < arr.length; ai++) {
          if (PY.repr(arr[ai]) === PY.repr(curVal)) { hitIdx = ai; break; }
        }
        ANIM.renderList(lw, arr, hitIdx);
        if (seen.length) {
          var tw = document.createElement('div');
          tw.className = 'track';
          seen.forEach(function (t) {
            var c = document.createElement('span');
            c.className = 'chip';
            c.textContent = elVar + '=' + t;
            tw.appendChild(c);
          });
          box.appendChild(tw);
        }
        lh.appendChild(box);
        note('每一轮循环,变量 <b>' + esc(elVar) + '</b> 会依次等于列表里的一个元素。');
        return;
      }
      fallback();
      return;
    }

    if (mWhile) {
      var box3 = document.createElement('div');
      box3.className = 'loopBox';
      var cv = evalInContext(mWhile[1], vars);
      var rounds = 0;
      hist.forEach(function (s) { if (s.src && s.src.trim() === src) rounds++; });
      box3.innerHTML =
        '<div class="loopHead">' +
          '<span class="pillVar" style="background:rgba(255,123,156,.12);border-color:rgba(255,123,156,.45);color:var(--pink)">while ' +
            esc(mWhile[1]) + '</span>' +
          '<span style="font-family:var(--mono);font-size:12.5px;color:var(--fg2)">当前求值 = <b style="color:' +
            (truthyOf(cv) ? 'var(--ok)' : 'var(--err)') + '">' +
            esc(cv === null ? '(求不出)' : PY.repr(cv)) + '</b></span>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--fg2);line-height:1.9">' +
          '条件为 <b style="color:var(--ok)">真</b> → 执行循环体,然后回到这一行重新判断。<br>' +
          '条件为 <b style="color:var(--err)">假</b> → 跳出循环,执行后面的代码。' +
        '</div>' +
        '<div style="margin-top:10px;font-size:11.5px;color:var(--fg3)">' +
          '这一行已经执行了 <b style="color:var(--acc)">' + rounds + '</b> 次判断' +
          (rounds > 200 ? ' —— <span style="color:var(--warn)">次数很多,注意是不是死循环</span>' : '') +
        '</div>';
      lh.appendChild(box3);
      note('while 的关键是:循环体里必须有让条件最终变成 <b>假</b> 的操作,否则永远出不去。');
      return;
    }

    fallback();

    function fallback() {
      var keys = Object.keys(vars);
      var html = '<div class="loopBox"><div style="font-size:12px;color:var(--fg2);line-height:2">' +
        '这一步不是循环语句。用「下一步 >」走到循环那一行,就能看到循环状态机。' +
        (keys.length ? '<br><span style="color:var(--fg3)">当前变量:' + esc(keys.join('、')) + '</span>' : '') +
        '</div></div>';
      lh.innerHTML = html;
    }
    function note(text) {
      var n = document.createElement('div');
      n.style.cssText = 'font-size:11.5px;color:var(--fg3);margin-top:10px;line-height:1.8';
      n.innerHTML = text;
      host.appendChild(n);
    }
  }


  function renderStackViz(host, st) {
    head(host, '函数调用栈', '(第 ' + st.line + '行)');
    var sh = document.createElement('div');
    sh.style.marginBottom = '12px';
    host.appendChild(sh);
    ANIM.renderStack(sh, st.stack || []);
    var wrap = document.createElement('div');
    wrap.className = 'varGrid';
    host.appendChild(wrap);
    ANIM.renderVars(wrap, st.vars, state.prevVars);
    var note = document.createElement('div');
    note.style.cssText = 'font-size:11.5px;color:var(--fg3);margin-top:10px;line-height:1.8';
    note.innerHTML = '栈顶(最上面那个框)是<b style="color:var(--acc)">当前正在执行的函数</b>。函数 return 之后,它的栈帧就会消失,值回到调用者手里。';
    host.appendChild(note);
  }


  function renderListViz(host, vars) {
    head(host, '容器可视化', '(列表 / 字典)');
    var keys = Object.keys(vars);
    if (!keys.length) {
      host.innerHTML += '<div style="color:var(--fg3);font-size:12px">还没有变量。</div>';
      return;
    }
    var wrap = document.createElement('div');
    wrap.className = 'varGrid';
    wrap.style.marginBottom = '14px';
    host.appendChild(wrap);
    ANIM.renderVars(wrap, vars, state.prevVars);

    keys.forEach(function (k) {
      var v = vars[k];
      if (Array.isArray(v) || (v && v.__kind === 'dict')) {
        var t = document.createElement('div');
        t.style.cssText = 'font-size:12px;color:var(--fg2);font-family:var(--mono);margin:10px 0 6px';
        t.textContent = k + ' =';
        host.appendChild(t);

  function renderMemoryViz(host, st) {
    var vars = (st && st.vars) || {};
    var ids = (st && st.ids) || {};

    // 分离:基本类型 vs 引用类型(列表/字典)
    var prims = [], refs = [], objs = {}, objOrder = [];
    Object.keys(vars).forEach(function (k) {
      var v = vars[k], t = PY.typeName(v);
      if (t === 'function' || t === 'module' || t === 'type') return;
      var id = ids[k];
      if (id) {
        refs.push({ name: k, id: id, val: v, type: t });
        if (!objs[id]) { objs[id] = { id: id, val: v, type: t, names: [] }; objOrder.push(id); }
        objs[id].names.push(k);
      } else {
        prims.push({ name: k, val: v, type: t });
      }
    });

    var wrap = document.createElement('div');
    wrap.id = 'memWrap';

    // 左列:变量
    var lc = document.createElement('div');
    lc.className = 'memCol vars';
    lc.innerHTML = '<div class="memHead">变量</div>';
    prims.concat(refs).forEach(function (x) {
      var d = document.createElement('div');
      var isRef = !!ids[x.name];
      d.className = 'memBox ' + (isRef ? 'ref' : 'prim');
      d.setAttribute('data-varname', x.name);

        d.innerHTML = '<span class="nm">' + esc(x.name) + '</span>' +
          '<span class="ty">' + esc(x.type) + '</span>';

        d.innerHTML = '<span class="nm">' + esc(x.name) + '</span> = ' +
          '<span class="vv">' + esc(txt) + '</span>' +
          '<span class="ty">' + esc(x.type) + '</span>';
      }
      lc.appendChild(d);
    });
    if (!prims.length && !refs.length) {
      lc.innerHTML += '<div style="color:var(--fg3);font-size:11px">还没有变量</div>';
    }

    // 右列:堆对象
    var rc = document.createElement('div');
    rc.className = 'memCol heap';
    rc.innerHTML = '<div class="memHead">内存中的对象</div>';
    objOrder.forEach(function (id) {

        }).join('');

          return '<span class="memCell"><i>' + esc(shortRepr(o.val.keyRepr[kk])) + '</i><b>' +
            esc(shortRepr(o.val.map[kk])) + '</b></span>';
        }).join('');
        if (!body) body = '<span style="color:var(--fg3)">空字典</span>';
      } else {
        body = esc(shortRepr(o.val));
      }
      d.innerHTML = '<div class="oid" style="display:flex;justify-content:space-between">' +
        '<span>' + esc(o.type) + ' #' + esc(id) + '</span>' +

        '改动其中任何一个,另一个也会跟着变 —— 这就是 Python 的「引用」。</div>';

  function drawMemoryArrows(wrap, refs, objs) {
    var old = wrap.querySelector('svg.memArrows');
    if (old) old.remove();
    if (!refs.length) return;

    var wr = wrap.getBoundingClientRect();
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'memArrows');
    svg.setAttribute('width', wr.width);
    svg.setAttribute('height', wr.height);
    svg.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible';
    var defs = document.createElementNS(NS, 'defs');
    defs.innerHTML =
      '<marker id="memArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="#ffd43b"/></marker>' +
      '<marker id="memArrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="#ff7b9c"/></marker>';
    svg.appendChild(defs);

    refs.forEach(function (r) {
      var src = wrap.querySelector('[data-varname="' + r.name + '"]');
      var dst = wrap.querySelector('[data-objid="' + r.id + '"]');
      if (!src || !dst) return;
      var sr = src.getBoundingClientRect(), dr = dst.getBoundingClientRect();
      var x1 = sr.right - wr.left, y1 = sr.top - wr.top + sr.height / 2;
      var x2 = dr.left - wr.left, y2 = dr.top - wr.top + dr.height / 2;
      var alias = objs[r.id] && objs[r.id].names.length > 1;
      var mid = x1 + (x2 - x1) * 0.5;
      var p = document.createElementNS(NS, 'path');
      // 三次贝塞尔,做出「先水平射出再弯向目标」的效果,多条线不易重叠
      p.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + mid + ',' + y1 + ' ' + mid + ',' + y2 + ' ' + x2 + ',' + y2);
      p.setAttribute('stroke', alias ? '#ff7b9c' : '#ffd43b');
      p.setAttribute('stroke-width', alias ? '2' : '1.4');
      p.setAttribute('fill', 'none');
      p.setAttribute('opacity', '0.9');
      p.setAttribute('marker-end', alias ? 'url(#memArrowA)' : 'url(#memArrow)');
      svg.appendChild(p);
    });
    wrap.appendChild(svg);
  }


  function beRebuild() {
    BE.byLine = {};
    for (var i = state.steps.length - 1; i >= 0; i--) {
      var st = state.steps[i];
      if (st && st.line && !BE.byLine[st.line]) BE.byLine[st.line] = st;
    }
  }

  function beGuessText(line) {
    var idx = -1;
    for (var i = state.steps.length - 1; i >= 0; i--) {
      if (state.steps[i].line === line) { idx = i; break; }
    }
    if (idx < 0) return null;
    var st = state.steps[idx];

    // 这一行执行完之后,输出到哪了?
    var afterVisit = st.outLen;
    for (var j = idx; j < state.steps.length; j++) {
      if (state.steps[j].line === line) afterVisit = Math.max(afterVisit, state.steps[j].outLen);
    }
    var next = state.steps[idx + 1];
    var afterExec = Math.max(afterVisit, next ? next.outLen : 0);

    if (afterExec > st.outLen) {
      var outs = (state.outLines || []).slice(st.outLen, afterExec).map(function (l) { return l.text; });
      if (outs.length) return outs.join('\n');
    }
    // 这一行没有产生输出:那就问「它执行后哪个变量变成了什么」
    var keys = Object.keys(st.vars || {});
    if (keys.length) {
      var k = keys[keys.length - 1];
      return k + ' = ' + PY.repr(st.vars[k]);
    }
    return '(这一行不产生输出)';
  }

  function beVarsHTML(vars) {
    var keys = Object.keys(vars || {});
    if (!keys.length) return '';
    var html = '', shown = 0;
    for (var i = 0; i < keys.length && shown < 2; i++) {
      var k = keys[i], v = vars[k];
      var t = PY.typeName(v);
      if (t === 'function' || t === 'module' || t === 'type') continue;
      var txt = PY.repr(v);
      if (txt.length > 12) txt = txt.slice(0, 11) + '…';
      html += '<span class="beVar"><b>' + esc(k) + '</b>=<i>' + esc(txt) + '</i></span>';
      shown++;
    }
    if (keys.length > shown + 1) html += '<span class="beMore">+' + (keys.length - shown) + '</span>';
    return html;
  }


  function renderBirdsEye() {
    var host = $('birdsEye');
    if (!host) return;
    if (!BE.on) { host.classList.add('off'); return; }
    host.classList.remove('off');

    var lines = $('code').value.split('\n');
    // 用真实行高对齐:取 textarea 计算后的 line-height
    try {
      var lh = parseFloat(getComputedStyle($('code')).lineHeight);
      if (lh > 0) BE.lh = lh;
    } catch (e) {}

    var html = '';
    for (var i = 1; i <= lines.length; i++) {
      var st = BE.byLine[i];
      var cls = 'beRow' + (i === state.curLine ? ' cur' : '') + (st && Object.keys(st.vars).length ? ' hasVars' : '');
      html += '<div class="' + cls + '" data-line="' + i + '" style="height:' + BE.lh + 'px">';
      if (st) {
        var outs = beGuessText(i);
        if (outs !== null) {
          var g = BE.guess[i];
          var gcls = g ? (g.correct ? ' right' : ' wrong') : '';
          html += '<button class="beGuess' + gcls + '" data-guess="' + i + '" title="先猜猜这行会输出什么">' +
            (g ? '' : '?') + '</button>';
        }
        html += beVarsHTML(st.vars);
      } else {
        html += '<span class="beEmpty">·</span>';
      }
      html += '</div>';
    }
    host.innerHTML = html;
    host.scrollTop = $('code').scrollTop;

    // 绑定预测按钮
    Array.prototype.forEach.call(host.querySelectorAll('[data-guess]'), function (b) {
      b.onclick = function (ev) { ev.stopPropagation(); openGuess(parseInt(b.dataset.guess, 10), b); };
    });
  }

  function closeGuess() {
    if (guessPop) { guessPop.remove(); guessPop = null; }
  }

  function openGuess(line, anchor) {
    closeGuess();
    var real = beGuessText(line);
    if (real === null) return;
    if (BE.guess[line]) { toast(BE.guess[line].correct ? '这行你已经猜对了 ✓' : '这行你猜错过,再想想', BE.guess[line].correct ? 'ok' : 'err'); return; }

    var st = BE.byLine[line];
    var src = st ? st.src : '';
    // 造 3 个选项:正确答案 + 两个干扰项
    var opts = [real];
    var others = [];
    // 干扰项 1:如果这行是 print 且有变量,换成「变量的当前值」
    var keys = Object.keys(st.vars || {});
    if (keys.length) {
      var lastK = keys[keys.length - 1];
      others.push(String(PY.repr(st.vars[lastK])).replace(/^'|'$/g, ''));
    }
    // 干扰项 2:数值偏移
    var num = parseFloat(String(real).trim());
    if (!isNaN(num) && /^-?\d+(\.\d+)?$/.test(String(real).trim())) {
      others.push(String(num + 1));
    } else {
      others.push('(没有输出)');
    }
    others = others.filter(function (o) { return o !== real; });
    while (others.length < 2) others.push(others.length ? '(' + others[0] + '的另一种写法)' : '报错');
    opts = opts.concat(others.slice(0, 2));
    // 打乱顺序
    for (var i = opts.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = opts[i]; opts[i] = opts[j]; opts[j] = t;
    }

    var pop = document.createElement('div');
    pop.className = 'guessPop';
    pop.innerHTML = '<div class="gq">先猜猜这一行会发生什么?<br><span style="color:var(--fg3);font-size:11px">' +
      esc(src.slice(0, 42)) + '</span></div><div class="gopts"></div>';
    var box = pop.querySelector('.gopts');
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = o === real ? o : o;
      b.onclick = function () {
        var ok = (o === real);
        BE.guess[line] = { correct: ok, chosen: o };
        var res = document.createElement('div');
        res.className = 'gres ' + (ok ? 'right' : 'wrong');
        res.innerHTML = (ok ? '猜对了!' : '不对 ——') +
          '<div class="gwhy">真实结果是:<b style="font-family:var(--mono)">' + esc(real) + '</b>' +
          (ok ? '' : '<br>点右上角 <b> 自动演示</b> 或 <b> 单步</b>,在动画里看它为什么会这样。') + '</div>';
        box.innerHTML = '';
        box.appendChild(res);
        renderBirdsEye();
        updateGuessScore();
      };
      box.appendChild(b);
    });
    document.body.appendChild(pop);
    guessPop = pop;
    // 定位到按钮附近
    var r = anchor.getBoundingClientRect();
    var pw = 250, ph = pop.offsetHeight;
    var left = Math.min(r.right + 8, window.innerWidth - pw - 12);
    var top = Math.min(r.top, window.innerHeight - ph - 12);
    if (top < 8) top = 8;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }

  function updateGuessScore() {
    var keys = Object.keys(BE.guess);
    if (!keys.length) { return; }
    var right = keys.filter(function (k) { return BE.guess[k].correct; }).length;
    var pill = $('stepPill');
    if (pill) pill.textContent = '预测 ' + right + ' / ' + keys.length + '对';
  }

  function syncBirdsBtn() {
    var b = $('btnBirds');
    if (!b) return;
    b.classList.toggle('acc', BE.on);
    b.textContent = BE.on ? '逐行留痕 开' : '逐行留痕';
  }

  function renderViz(stepIdx) {
    var lv = ALL_LEVELS[state.cur];
    var host = $('stageInner');
    var viz = lv.viz || { type: 'vars', title: '可视化' };
    var ctrl = $('vizCtrl');

    var st = (stepIdx !== null && state.steps[stepIdx]) ? state.steps[stepIdx] : null;
    var vars = st ? st.vars : {};
    var prevVars = state.prevVars;

    // 视图模式:'level' = 本关专属动画;'mem' = 通用内存模型图(B 方案)
    var memMode = (vizMem === 'mem');
    $('vizTitle').textContent = memMode ? '内存模型图:变量 → 对象' : (viz.title || '可视化舞台');

    // 公共控制条(保留用户已设置的播放速度)
    var keepSpeed = ($('speed') && $('speed').value) || 3;
    ctrl.innerHTML =
      '<button class="btn sm" id="vFirst"> 首步</button>' +
      '<button class="btn sm" id="vPrev">< 上一步</button>' +
      '<button class="btn sm pri" id="vNext">下一步 ></button>' +
      '<button class="btn sm" id="vAuto2"> 自动</button>' +
      '<button class="btn sm' + (memMode ? ' acc' : '') + '" id="vMem" title="' +
        (memMode ? '切回本关专属动画' : '换一种画法:用方块和箭头表示变量与内存对象,能看清「两个变量指向同一个列表」这类概念') +
      '">' + (memMode ? '本关动画' : '内存模型') + '</button>' +
      '<span class="spacer"></span>' +
      '<span class="pill" id="vStep"></span>' +
      '<label class="inl">速度 <input type="range" id="speed" min="1" max="10" value="' + keepSpeed + '"></label>';
    $('vFirst').onclick = function () { stopAuto(); applyStep(0); };
    $('vPrev').onclick = function () { stopAuto(); applyStep(state.stepIdx - 1); };
    $('vNext').onclick = function () { stopAuto(); stepNext(); };
    $('vAuto2').onclick = function () { toggleAuto(); };
    $('vMem').onclick = function () {
      vizMem = memMode ? 'level' : 'mem';
      renderViz(state.stepIdx);
      toast(memMode ? '已切回本关专属动画' : '已切到内存模型图:黄色箭头 = 引用,粉色箭头 = 多个变量指向同一个对象');
    };
    $('vStep').textContent = (state.steps.length ? (state.stepIdx + 1) + ' / ' + state.steps.length : '0 / 0');
    $('speed').oninput = function () { if (state.playing) { stopAuto(); toggleAuto(); } };

    if (!st) {
      host.innerHTML = '<div style="color:var(--fg3);font-size:12.5px;line-height:1.9">' +
        '还没有执行数据。<br>先点右上角 <b style="color:var(--acc)">> 运行</b>,再回到这里按 <b style="color:var(--acc)"> 自动演示</b>,' +
        '就能看到代码一步一步执行的过程。</div>';
      return;
    }

    if (memMode) { renderMemoryViz(host, st); state.prevVars = vars; return; }

    switch (viz.type) {
      case 'vars': renderVarsViz(host, st, prevVars); break;
      case 'string': renderStringViz(host, st); break;
      case 'condition': renderConditionViz(host, st); break;
      case 'loop': renderLoopViz(host, vars, st); break;
      case 'stack': renderStackViz(host, st); break;
      case 'list': renderListViz(host, vars); break;
      case 'file': renderFileViz(host, vars, st); break;
      case 'module': renderModuleViz(host, vars, st); break;
      case 'class': renderClassViz(host, vars, st); break;
      case 'exception': renderExceptionViz(host, st); break;
      case 'project': renderProjectViz(host, vars, st); break;
      default: renderVarsViz(host, st, prevVars);
    }
    state.prevVars = vars;
  }


  function shortRepr(v) {
    var s = PY.repr(v);
    if (s.length > 14) s = s.slice(0, 13) + '…';
    return s;
  }

  globalThis.__PY1H = {
    state: state, PROG: PROG, ALL_LEVELS: ALL_LEVELS, BUILD: BUILD,
    buildTestCases: buildTestCases, runTestSuite: runTestSuite,
    runSelfTest: runSelfTest, doRun: doRun, highlight: highlight,
    renderCenter: renderCenter, goLevel: goLevel
  };

  if (typeof document !== 'undefined' && typeof localStorage !== 'undefined') {
    try {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          try { boot(); } catch (e) { throw e; }
        });
      } else {
        boot();
      }
    } catch (e) {
      // 交给 [BLOCK:GUARD] 的兜底面板展示
      if (window.onerror) window.onerror('boot failed', 'inline', 0, 0, e);
      else throw e;
    }
  }
})();
</script>

<!-- BOOT · 开场:档案封面(参考 dsh-startup-screen 的设计语言与编排逻辑) -->
<script>
/* [BLOCK:BOOT] 开场:档案封面(参考 dsh-startup-screen 的设计语言与编排逻辑) */
/* ==========================================================================
   [BLOCK:BOOT] 开场:档案封面
   --------------------------------------------------------------------------
   设计语言与编排逻辑参考 dsh-startup-screen,但**不是照搬开机动画**:

   插件的手法本质是用「档案封面」的语汇建立仪式感与次序感。
   而在这里,「次序」本身就有意义 —— 课程的幕次结构。
   所以这里不做逐幕播放的动画,而是做一份**可操作的档案封面**:

     · 一次看全全部幕次的分组结构(不是一幕幕等)
     · 分组可展开,点任意一幕直接进入(真正的导航价值)
     · 自己只会停留一次(同会话不重复),看完即归档
     · 亮/暗两种底板,跟随系统偏好

   [!] 封面内容必须**全部从课程数据推导**,不允许硬编码幕数。
      踩过一次:封面上写死「12 ACTS · 73 MIN」,课程扩到 32 幕后
      封面还在说 12 幕,学员一进来就看到错误信息。
      现在幕数、时长、分组、参考编号全部由 CURRICULUM 现算。

   复用的设计语汇:暖白档案底板 / 等宽字距状态行 / 中文主字 + 英文等宽副标题 /
   四角定位标记 / 一次性扫描线 / 分段进度 / 逐字渐显 / 收束时的色散与光晕。
   音效现场合成,零外部素材。
   ========================================================================== */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  /* ---------- 封面内容:全部从课程数据推导 ----------
     返回 { groups:[{name, zh, en, levels:[{idx, num, title, min}]}], acts, minutes }
     数据不可用时退化成一份最小可用的占位,保证封面不会白屏。 */
  function coverData() {
    var groups = [], acts = 0, minutes = 0, idx = 0;
    try {
      var C = (typeof CURRICULUM !== 'undefined') ? CURRICULUM : null;
      if (!C && window.__PY1H && window.__PY1H.ALL_LEVELS) {
        /* 退路:只有扁平幕表时,当成一个分组显示 */
        var flat = window.__PY1H.ALL_LEVELS;
        var lv = flat.map(function (l, i) {
          acts++; minutes += (l.min || 0);
          return { idx: i, num: l.num, title: l.title, min: l.min };
        });
        return { groups: [{ name: '全部幕次', zh: '全部幕次', en: 'ALL ACTS', levels: lv }], acts: acts, minutes: minutes };
      }
      if (C) {
        C.forEach(function (g) {
          var lv = (g.levels || []).map(function (l) {
            acts++; minutes += (l.min || 0);
            return { idx: idx++, num: l.num, title: l.title, min: l.min };
          });
          if (!lv.length) return;
          var nm = g.group || '';
          /* 分组名形如「第二层 · 空间分析」,拆出中英文两层显示 */
          var parts = nm.split(' · ');
          groups.push({
            name: nm,
            layer: parts.length > 1 ? parts[0] : '',
            zh: parts.length > 1 ? parts[1] : nm,
            en: '',
            levels: lv
          });
        });
      }
    } catch (e) { /* 数据异常时保持已有的部分 */ }
    return { groups: groups, acts: acts, minutes: minutes };
  }

  var COVER = coverData();
  /* 参考编号:REF 1H-12 这种写法改成按实际幕数生成 */
  function refCode() {
    var h = Math.max(1, Math.round(COVER.minutes / 60));
    return h + 'H-' + COVER.acts;
  }

  /* ---------- 音效:全部现场合成 ---------- */
  var AC = null, MASTER = null;
  function actx() {
    if (AC) return AC;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      AC = new C();
      MASTER = AC.createGain();
      MASTER.gain.value = 0.3;
      MASTER.connect(AC.destination);
    } catch (e) { AC = null; }
    return AC;
  }
  function sfxTick() {
    var a = actx(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'square'; o.frequency.value = 1620 + Math.random() * 260;
      g.gain.setValueAtTime(0.03, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.02);
      o.connect(g); g.connect(MASTER); o.start(); o.stop(a.currentTime + 0.028);
    } catch (e) {}
  }
  function sfxBeep(f) {
    var a = actx(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f || 880, a.currentTime);
      o.frequency.exponentialRampToValueAtTime((f || 880) * 1.5, a.currentTime + 0.09);
      g.gain.setValueAtTime(0.085, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.17);
      o.connect(g); g.connect(MASTER); o.start(); o.stop(a.currentTime + 0.19);
    } catch (e) {}
  }
  function sfxWash() {
    var a = actx(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(120, a.currentTime);
      o.frequency.exponentialRampToValueAtTime(1100, a.currentTime + 0.5);
      g.gain.setValueAtTime(0.0001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.09, a.currentTime + 0.16);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.56);
      o.connect(g); g.connect(MASTER); o.start(); o.stop(a.currentTime + 0.6);
    } catch (e) {}
  }

  /* ---------- 状态 ---------- */
  var state = { armed: true, closed: false, ticked: false };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&quot;';
    });
  }

  /** 逐行渐显:用不透明度,不会引起排版抖动 */
  function typeIn(host, text, step) {
    host.innerHTML = '';
    var spans = [];
    for (var i = 0; i < text.length; i++) {
      var s = document.createElement('span');
      s.className = 'bt-ch';
      s.textContent = text.charAt(i) === ' ' ? '\u00a0' : text.charAt(i);
      host.appendChild(s);
      spans.push(s);
    }
    host.classList.add('in');
    if (reduced || !state.armed) {
      spans.forEach(function (s) { s.style.opacity = '1'; s.style.transform = 'none'; });
      return Promise.resolve();
    }
    var idx = 0, per = Math.max(1, Math.round(text.length / 22));
    var iv = setInterval(function () {
      if (!state.armed) { clearInterval(iv); return; }
      for (var k = 0; k < per && idx < spans.length; k++, idx++) {
        spans[idx].style.opacity = '1';
        spans[idx].style.transform = 'none';
        if (idx % 3 === 0) sfxTick();
      }
      if (idx >= spans.length) clearInterval(iv);
    }, Math.max(18, step || 30));
    return new Promise(function (res) {
      var t = setInterval(function () {
        if (!state.armed || idx >= spans.length) { clearInterval(t); res(); }
      }, 28);
    });
  }

  function wait(ms) {
    return new Promise(function (r) { setTimeout(r, reduced ? Math.min(ms, 50) : ms); });
  }

  /* ---------- 构建封面 ---------- */
  function buildCover() {
    /* 目录做成「分组标题 + 组内幕次」两层:
       为什么不用原来的平铺 list —— 12 幕时一列还能看,32 幕就成了一堵墙。
       分组折叠既能一眼看全结构,又能展开挑具体某一幕,
       而且幕数再涨也不会失控。 */
    var gi = 0;
    var groupsHtml = COVER.groups.map(function (g) {
      var myG = gi++;
      var rows = g.levels.map(function (l) {
        return '<button class="bt-row" data-act="' + l.idx + '" data-group="' + myG + '" type="button">' +
          '<span class="n">' + esc(l.num) + '</span>' +
          '<span class="zh">' + esc(l.title) + '</span>' +
          '<span class="note">' + (l.min ? l.min + ' MIN' : '') + '</span>' +
          '<span class="go">></span>' +
          '</button>';
      }).join('');
      var gMin = g.levels.reduce(function (a, l) { return a + (l.min || 0); }, 0);
      return '<div class="bt-group" data-group="' + myG + '">' +
        '<button class="bt-ghead" data-gtoggle="' + myG + '" type="button">' +
          '<span class="gk">' + (g.layer ? esc(g.layer) : 'COURSE') + '</span>' +
          '<span class="gzh">' + esc(g.zh) + '</span>' +
          '<span class="gn">' + g.levels.length + '幕 · ' + gMin + ' MIN</span>' +
          '<span class="gx">+</span>' +
        '</button>' +
        '<div class="bt-rows" data-grows="' + myG + '">' + rows + '</div>' +
      '</div>';
    }).join('');

    return '' +
    '<div class="bt-plate" id="btPlate"></div>' +
    '<div class="bt-watermark" id="btWatermark"><div class="bt-wm">PY</div></div>' +
    '<div class="bt-grain" id="btGrain"></div>' +

    '<div class="bt-brand" id="btBrand">' +
      '<div class="bt-brand-1">Python 核心语法档案</div>' +
      '<div class="bt-brand-2">PYTHON CORE SYNTAX ARCHIVE</div>' +
      '<div class="bt-brand-3">REF <b>' + esc(refCode()) + '</b> · 20% SUBSET + SPATIOTEMPORAL</div>' +
    '</div>' +

    '<div class="bt-head" id="btHead">' +
      '<div class="bt-badge" id="btBadge">ARCHIVE COVER</div>' +
      '<h1 class="bt-title" id="btTitle"></h1>' +
      '<div class="bt-sub-en" id="btSubEn"></div>' +
      '<div class="bt-lead" id="btLead">' +
        '从第一个 <b>print</b> 到时空自相关。<b>第一层 17 幕</b>打底语法,' +
        '<b>第二层 14 幕</b>进入数据分析、机器学习与时空分析。' +
        '每一幕都配一段可以自己动手改的代码、一张看得出执行过程的图示、几道检验理解的题目。' +
      '</div>' +
      '<div class="bt-meta" id="btMeta"></div>' +
    '</div>' +

    '<div class="bt-index" id="btIndex">' +
      '<div class="bt-index-head">' +
        '<span class="meta">目录 · INDEX</span>' +
        '<span class="meta" id="btIndexHint">点分组展开 · 点幕次直接进入</span>' +
      '</div>' +
      '<div class="bt-groups" id="btRows">' + groupsHtml + '</div>' +
    '</div>' +

    '<div class="bt-action" id="btAction">' +
      '<button class="bt-btn pulse" id="btStart" type="button">' +
        '<span class="bt-btn-zh">开始学习</span>' +
        '<span class="bt-btn-en">ENTER ARCHIVE</span>' +
      '</button>' +
      '<div class="bt-hint" id="btHint">或按 ENTER · 从上次未完成的地方继续</div>' +
    '</div>' +

    '<div class="bt-stepcount" id="btStepcount">' + COVER.acts + ' ACTS · ' + COVER.minutes + ' MIN</div>' +
    '<button class="bt-skip" id="btSkip" type="button">SKIP ></button>' +

    '<div class="bt-frame in" id="btFrame">' +
      '<i class="bt-corner bt-c-tl"></i><i class="bt-corner bt-c-tr"></i>' +
      '<i class="bt-corner bt-c-bl"></i><i class="bt-corner bt-c-br"></i>' +
    '</div>' +
    '<div class="bt-scanline" id="btScanline"></div>';
  }

  var el = {};

  /* ---------- 关闭封面 ---------- */
  function close(actIndex) {
    if (state.closed) return;
    state.closed = true;
    state.armed = false;
    sfxWash();
    try { sessionStorage.setItem('pyArchive.booted', '1'); } catch (e) {}

    var boot = $('boot');
    var app = $('app');
    if (boot) {
      boot.classList.add('wash');
      setTimeout(function () { boot.classList.add('gone'); }, 120);
      setTimeout(function () { boot.style.display = 'none'; }, 760);
    }
    if (app) {
      app.classList.remove('hidden');
      var s = $('wsScan');
      if (s) { s.classList.add('go'); setTimeout(function () { s.classList.remove('go'); }, 2100); }
    }
    // 揭幕后把选择交给工作面
    if (typeof actIndex === 'number' && actIndex >= 0) {
      try {
        window.dispatchEvent(new CustomEvent('py-archive:jump', { detail: { act: actIndex } }));
      } catch (e) {}
    }
  }

  /* ---------- 抹掉封面(不播任何东西)----------
     同会话已看过时走这条:不做动画、不出声、直接进入工作面。 */
  function silentClose() {
    state.closed = true;
    state.armed = false;
    var boot = $('boot');
    if (boot) boot.style.display = 'none';
    var app = $('app');
    if (app) app.classList.remove('hidden');
  }

  /* ---------- 启动 ---------- */
  function run() {
    var boot = $('boot');
    if (!boot) return;
    var app = $('app');

    // 同一次会话只看一次;?cover=1 可强制再看
    var seen = false;
    try { seen = sessionStorage.getItem('pyArchive.booted') === '1'; } catch (e) {}
    var force = /[?&]cover=1/.test(location.search);
    if (seen && !force) { silentClose(); return; }

    // 按当前状态构造封面,插到 #boot 里
    boot.innerHTML = '<div class="bt-card-wrap" id="btCardWrap">' + buildCover() + '</div>' +
      '<div class="bt-flash" id="btFlash"></div>' +
      '<div class="bt-bloom" id="btBloom"></div>' +
      '<div class="bt-vignette" id="btVignette"></div>';

    el = {
      boot: boot,
      plate: $('btPlate'), grain: $('btGrain'), watermark: $('btWatermark'),
      brand: $('btBrand'), title: $('btTitle'), subEn: $('btSubEn'),
      lead: $('btLead'), meta: $('btMeta'), rows: $('btRows'),
      action: $('btAction'), skip: $('btSkip'), flash: $('btFlash'),
      bloom: $('btBloom'), vignette: $('btVignette')
    };

    // 元数据行(照插件的等宽状态行语汇)
    var id = '——';
    var name = '';
    try {
      id = localStorage.getItem('pyArchive.id') || '';
      name = localStorage.getItem('pyArchive.name') || '';
      if (!id) {
        id = String(Math.floor(1000 + Math.random() * 9000));
        localStorage.setItem('pyArchive.id', id);
      }
    } catch (e) { id = '0000'; }
    var today = new Date();
    var dateStr = today.getFullYear() + '-' +
      String(today.getMonth() + 1).padStart(2, '0') + '-' +
      String(today.getDate()).padStart(2, '0');
    el.meta.innerHTML =
      '<span class="bt-chip">ID <b>' + esc(id) + '</b></span>' +
      '<span class="bt-chip">' + esc(dateStr) + '</span>' +
      '<span class="bt-chip">' + COVER.acts + ' ACTS</span>' +
      '<span class="bt-chip">' + COVER.minutes + ' MIN</span>' +
      '<span class="bt-chip">' + COVER.groups.length + ' SECTIONS</span>' +
      '<span class="bt-chip">20% CORE + ST</span>' +
      (name ? '<span class="bt-chip">LEARNER <b>' + esc(name) + '</b></span>' : '');

    // 逐字渐显:品牌 → 标题 → 副标题
    setTimeout(function () { el.plate.classList.add('in'); }, 60);
    setTimeout(function () { el.grain.classList.add('in'); el.watermark.classList.add('in'); }, 200);
    setTimeout(function () { el.brand.classList.add('in'); }, 260);

    typeIn(el.title, '从零基础到时空分析', 34).then(function () {
      if (!state.armed) return;
      typeIn(el.subEn, 'PYTHON CORE SYNTAX + SPATIOTEMPORAL · ' + COVER.acts + ' ACTS', 22);
    });

    /* 目录先只展开第一个分组 —— 既给出结构全貌,又不至于一屏挤满 */
    var groups = el.rows ? el.rows.querySelectorAll('.bt-group') : [];
    Array.prototype.forEach.call(groups, function (g, i) {
      if (i === 0) g.classList.add('open');
      setTimeout(function () { g.classList.add('in'); }, 560 + i * 34);
    });

    // 目录逐行浮入
    var rowEls = el.rows ? el.rows.querySelectorAll('.bt-row') : [];
    Array.prototype.forEach.call(rowEls, function (r, i) {
      setTimeout(function () { r.classList.add('in'); }, 620 + i * 42);
    });

    // 一次性扫描线
    setTimeout(function () {
      var s = $('btScanline');
      if (s) s.classList.add('go');
    }, 420);

    // 交互:点分组标题展开/收起;点幕次直接进入
    var headEls = el.rows ? el.rows.querySelectorAll('.bt-ghead') : [];
    Array.prototype.forEach.call(headEls, function (h) {
      h.onclick = function () {
        var g = h.parentNode;
        if (!g) return;
        g.classList.toggle('open');
        /* 展开时把组内幕次补上浮入动画(初次展开才需要) */
        if (g.classList.contains('open')) {
          var rs = g.querySelectorAll('.bt-row');
          Array.prototype.forEach.call(rs, function (r, i) {
            if (r.classList.contains('in')) return;
            setTimeout(function () { r.classList.add('in'); }, i * 26);
          });
        }
      };
    });
    Array.prototype.forEach.call(rowEls, function (r) {
      r.onclick = function (ev) {
        if (ev) ev.stopPropagation();
        close(parseInt(r.dataset.act, 10));
      };
    });
    if (el.skip) el.skip.onclick = function () { close(-1); };
    var startBtn = $('btStart');
    if (startBtn) startBtn.onclick = function () {
      // 从第一幕未完成的地方开始
      var first = 0;
      try {
        var P = window.__PY1H && window.__PY1H.PROG;
        var L = window.__PY1H && window.__PY1H.ALL_LEVELS;
        if (P && L) {
          for (var i = 0; i < L.length; i++) { if (!P.done[L[i].id]) { first = i; break; } first = i; }
        }
      } catch (e) {}
      close(first);
    };
    window.addEventListener('keydown', function (e) {
      if (state.closed) return;
      if (e.key === 'Enter' || e.key === ' ') {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
        e.preventDefault();
        if (startBtn) startBtn.click();
      } else if (e.key === 'Escape') {
        close(-1);
      } else if (/^(ArrowDown|ArrowUp)$/.test(e.key)) {
        /* 上下键在「分组标题 + 组内幕次」之间移动焦点,纯键盘也能走完整个目录 */
        var all = el.rows ? el.rows.querySelectorAll('.bt-ghead, .bt-row') : [];
        if (!all.length) return;
        e.preventDefault();
        var cur = -1;
        for (var i = 0; i < all.length; i++) if (all[i] === document.activeElement) cur = i;
        var next = e.key === 'ArrowDown' ? Math.min(all.length - 1, cur + 1) : Math.max(0, cur - 1);
        all[next].focus();
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        /* 左右键展开/收起当前分组 —— 与文件管理器的操作习惯一致 */
        var g0 = document.activeElement && document.activeElement.closest
          ? document.activeElement.closest('.bt-group') : null;
        if (g0) { e.preventDefault(); g0.classList.toggle('open', e.key === 'ArrowRight'); }
      }
    }, true);

    // 让工作面知道封面开着,但它照常初始化(不必等)
    try { window.__PY1H && window.__PY1H.markReady && window.__PY1H.markReady(); } catch (e2) {}
  }

  /* ---------- 对外接口 ---------- */
  window.__BOOT__ = {
    replay: function () {
      try { sessionStorage.removeItem('pyArchive.booted'); } catch (e) {}
      location.reload();
    },
    close: close,
    id: function () {
      try { return localStorage.getItem('pyArchive.id') || ''; } catch (e) { return ''; }
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else { run(); }
})();
</script>
</body>
</html>
