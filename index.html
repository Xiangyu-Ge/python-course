(function () {

  function showPanel(title, detail) {

      d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#e5e3df;color:#0a0a0a;' +

      });
      d.innerHTML =
        '<div style="font-size:20px;font-weight:700;color:#c0392b;margin-bottom:6px">[!] ' + title + '</div>' +
        '<div style="color:#3a3936;margin-bottom:18px;max-width:780px;font-family:system-ui">' +
          '界面的 JavaScript 没能正常启动,所以按钮都不会有反应。这不是你的操作问题。' +

          '<div style="color:#ff7500;font-weight:700;margin-bottom:8px">请按顺序试这三步</div>' +

          '<div>3. 仍然不行,把下面框里的文字发给开发者</div>' +
        '</div>' +
        '<div style="background:#0a0a0a;color:#f2f1ee;border-radius:10px;padding:14px 16px;' +
          'white-space:pre-wrap;max-width:900px">' + safe + '</div>' +
        '<div style="margin-top:16px;color:#7a7873;font-size:12px">构建版本:' + BUILD +
          ' · 页面地址:' + location.href + '</div>';
      document.body.appendChild(d);
    } catch (e) {
      try { alert(title + '\n\n' + detail); } catch (e2) {}
    }
  }
  window.onerror = function (msg, src, line, col, err) {
    showPanel('页面脚本出错', (err && err.stack ? err.stack : msg) +
      '\n\n文件:' + src + '\n行号:' + line + ':' + col);
    return false;
  };
  window.addEventListener('load', function () {
    setTimeout(function () {
      var ok = window.__PY1H && window.__PY1H.ALL_LEVELS && window.__PY1H.ALL_LEVELS.length;
      var navHasItems = false;
      try { navHasItems = document.querySelectorAll('#nav .navItem').length > 0; } catch (e) {}
      if (!ok || !navHasItems) {
        showPanel('页面没有启动成功',
          '__PY1H 存在: ' + (!!window.__PY1H) + '\n' +
          '关卡数据: ' + (ok ? ok + '关' : '无') + '\n' +
          '左侧导航渲染出的关卡数: ' + (navHasItems ? '有' : '0(应为 12)') + '\n' +
          'window.PY(解释器): ' + (window.PY ? '存在' : '不存在') + '\n' +
          'window.ANIM(动画引擎): ' + (window.ANIM ? '存在' : '不存在') + '\n' +
          '脚本块总数: ' + document.querySelectorAll('script').length + '\n' +
          'localStorage 可用: ' + (function () { try { localStorage.getItem('x'); return true; } catch (e) { return false; } })() + '\n' +
          '页面地址: ' + location.href);
      }
    }, 3500);
  });
})();

:root{
  /* 底板与墨色(照参考片色板) */
  --bg:#e5e3df;            /* 主底板:暖灰白 */
  --bg-2:#eceae6;          /* 渐变亮端 */

  --ink:#0a0a0a;           /* 主墨色 */

  --hair:rgba(10,10,10,.16);      /* 发丝线 */
  --hair-soft:rgba(10,10,10,.07);
  --accent:#ff7500;        /* 强调色:橙 */
  --glitch-a:#ff3b30;      /* 色散故障 · 红 */
  --glitch-b:#2971b8;      /* 色散故障 · 蓝 */
  --ok:#2f7d4f;
  --warn:#b4770a;
  --err:#c0392b;

  /* 深色工作台(代码 / 输出 / 可视化)—— 与暖白底板形成"屏幕"对比 */
  --deep:#0a0a0a;
  --deep-2:#141414;
  --deep-3:#1d1d1c;
  --deep-hair:rgba(255,255,255,.14);
  --deep-hair-soft:rgba(255,255,255,.07);
  --deep-ink:#f2f1ee;
  --deep-muted:#8d8b86;
  /* 数据类型配色(深底上) */
  --t-int:#5ec8d8;
  --t-float:#b98cf0;
  --t-str:#8fd98a;
  --t-bool:#ff8fa8;
  --t-list:#ffb347;
  --t-dict:#6fa8ff;

  /* 字体:全部系统自带,零网络依赖 */
  --din:"Bahnschrift","DIN Alternate","DIN Condensed","Arial Narrow","Liberation Sans Narrow",
        "Ubuntu Condensed","Roboto Condensed","Microsoft YaHei","微软雅黑",sans-serif;
  /* [!] 等宽字体栈必须把「中文字体」放在很靠前的位置,理由:
     "Cascadia Mono" 等西文等宽字体在部分 Windows 上并不存在(尤其 Win10 早期版本),
     一旦全部落空,浏览器回退到 generic monospace 会选到某些**中文点阵等宽字体**
     (典型是"新宋体"),它们缺 ASCII 标点的字形 ——
     结果就是 **引号 " 显示成方框,而汉字完全正常**。
     微软雅黑在中文 Windows 上必然存在,且同时含西文与标点,
     所以把它放在西文等宽字体之后、generic monospace 之前作为兜底。
     (这个现象是用户反复反馈「引号显示不对」后定位到的) */
  --mono:"Cascadia Mono","Cascadia Code","SFMono-Regular",Consolas,"Courier New",
        Menlo,"DejaVu Sans Mono","Microsoft YaHei","微软雅黑","PingFang SC",

  --zh:"Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB","HarmonyOS Sans SC",

  /* 界面符号专用:优先用微软雅黑(它含 * > [!] 等符号),避免落进缺字形的西文字体 */
  --sym:"Microsoft YaHei","微软雅黑","Segoe UI Symbol","Segoe UI Emoji",

  --speed:1;

}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 90% at 78% 6%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 55%),

  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--din);
  font-size:14px;line-height:1.7;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
code,kbd,pre{font-family:var(--mono)}

.deep-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18)}

/* ================= 通用小元件 ================= */
.meta{                       /* 等宽字距元数据 —— 本设计的标志性排版 */

}

.tag{

}
.tag.on{border-color:var(--accent);color:var(--accent)}
.tag.done{border-color:var(--ok);color:var(--ok)}

/* ============================================================================

/* ============================================================================
 * 开场:档案封面
 * ----------------------------------------------------------------------------
 * 设计语言取自 dsh-startup-screen(暖白档案底板 / 等宽字距状态行 /
 * 中文主字 + 英文等宽副标题 / 四角定位标记 / 一次性扫描线 / 逐字渐显 /
 * 收束时的色散与光晕),但结构是「一页可操作的目录」而不是逐幕播放的动画。
 * ========================================================================== */
#boot{
  position:fixed;inset:0;z-index:2147483000;overflow:hidden;
  background:#000;cursor:default;user-select:none;
  transition:opacity 560ms cubic-bezier(.4,0,.2,1);
}
#boot.gone{opacity:0;pointer-events:none}
#boot *{box-sizing:border-box}
.bt-card-wrap{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:5vh 5vw;overflow-y:auto}

/* 暖白底板 + 颗粒 + 水印 */
.bt-plate{position:absolute;inset:0;z-index:1;opacity:0;
  background:
    radial-gradient(120% 90% at 78% 10%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 55%),
    linear-gradient(168deg,var(--bg-2) 0%,var(--bg) 42%,var(--bg) 100%);
  transition:opacity 900ms ease}
.bt-plate.in{opacity:1}
.bt-grain{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;
  transition:opacity 1.2s ease;
  background-image:
    repeating-linear-gradient(0deg,rgba(10,10,10,.026) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(10,10,10,.018) 0 1px,transparent 1px 4px)}
.bt-grain.in{opacity:1}
.bt-watermark{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;
  transition:opacity 1.4s ease;display:grid;place-items:center;overflow:hidden}
.bt-watermark.in{opacity:1}
.bt-wm{font-family:var(--din);font-weight:700;font-size:24vw;line-height:.8;
  color:rgba(10,10,10,.032);letter-spacing:-.03em;white-space:nowrap}

/* 品牌块(左上) */
.bt-brand{position:absolute;left:46px;top:42px;z-index:24}
.bt-brand>div{opacity:0;transform:translateY(8px);
  transition:opacity 520ms ease,transform 520ms var(--ease-out)}
.bt-brand.in .bt-brand-1{opacity:1;transform:none;transition-delay:60ms}
.bt-brand.in .bt-brand-2{opacity:1;transform:none;transition-delay:150ms}
.bt-brand.in .bt-brand-3{opacity:1;transform:none;transition-delay:240ms}
.bt-brand-1{font-family:var(--din);font-weight:700;font-size:18px;letter-spacing:.16em;color:var(--ink)}
.bt-brand-2{font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--muted);margin-top:3px}
.bt-brand-3{font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--muted);margin-top:2px}
.bt-brand-3 b{color:var(--accent);font-weight:700}

/* ---------- 封面主体(居中一栏) ---------- */
.bt-head{position:relative;z-index:10;width:100%;max-width:940px;
  margin-top:4vh;margin-bottom:26px}
.bt-badge{
  display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.36em;
  color:var(--accent);border:1px solid var(--accent);padding:3px 9px;text-indent:.36em;
  margin-bottom:20px;opacity:0;transform:translateY(-6px);

.bt-badge.in{opacity:1;transform:none}
.bt-title{

.bt-title .bt-ch{display:inline-block;opacity:0;transform:translateY(.14em);
  transition:opacity 280ms ease,transform 280ms ease}
.bt-title.in .bt-ch{opacity:1;transform:none}
.bt-sub-en{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;color:var(--muted);

.bt-sub-en .bt-ch{display:inline-block;opacity:0;transform:translateY(.1em);

.bt-sub-en.in .bt-ch{opacity:1;transform:none}

/* ---------- 目录 ---------- */
.bt-index{position:relative;z-index:10;width:100%;max-width:940px}
.bt-index-head{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:9px;border-bottom:1px solid var(--hair)}
.bt-index-head .meta{font-size:9.5px;letter-spacing:.24em}
/* 目录改成「分组折叠」两层结构。
   为什么不用原来的两列平铺:12 幕时还能看,32 幕就成了一堵墙。
   分组能一眼看全课程骨架,又可按组展开挑具体某一幕。 */
.bt-groups{margin-top:4px}
.bt-group{
  border-bottom:1px solid var(--hair-soft);
  opacity:0;transform:translateY(6px);
  transition:opacity 420ms ease,transform 420ms var(--ease-out);
}
.bt-group.in{opacity:1;transform:none}
.bt-ghead{
  display:grid;grid-template-columns:62px minmax(0,1fr) auto 14px;
  align-items:center;gap:12px;width:100%;text-align:left;
  padding:10px 6px;background:transparent;color:var(--ink);
  transition:background 180ms ease;
}
.bt-ghead:hover,.bt-ghead:focus-visible{background:rgba(255,255,255,.72);outline:none}
.bt-ghead .gk{
  font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--muted);
  text-transform:uppercase;
}
.bt-ghead .gzh{font-family:var(--zh);font-size:14px;font-weight:600;color:var(--ink)}
.bt-ghead .gn{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);
  white-space:nowrap}
.bt-ghead .gx{
  font-family:var(--mono);font-size:14px;color:var(--hair);text-align:right;
  transition:transform 220ms var(--ease-out),color 180ms ease;
}
.bt-group.open .bt-ghead .gx{transform:rotate(45deg);color:var(--accent)}
.bt-group.open .bt-ghead .gzh{color:var(--accent)}
/* 组内幕次默认收起 */
.bt-group .bt-rows{
  display:grid;grid-template-columns:1fr;
  max-height:0;overflow:hidden;
  transition:max-height 320ms var(--ease-out);
}
.bt-group.open .bt-rows{max-height:1400px}
/* 组内行缩进,并用左侧竖线表明归属 */
.bt-group .bt-row{padding-left:14px;border-left:2px solid transparent}
.bt-group .bt-row:hover,.bt-group .bt-row:focus-visible{border-left-color:var(--accent)}
.bt-row{
  display:grid;grid-template-columns:30px minmax(0,1fr) auto 14px;
  align-items:center;gap:10px;width:100%;text-align:left;
  padding:7px 6px;border-bottom:1px solid var(--hair-soft);
  background:transparent;color:var(--ink-soft);
  opacity:0;transform:translateY(6px);
  transition:opacity 420ms ease,transform 420ms var(--ease-out),
             background 180ms ease,border-color 180ms ease;
}
.bt-row.in{opacity:1;transform:none}
.bt-row .n{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);

.bt-row .zh{font-family:var(--zh);font-size:12.5px;font-weight:400;color:var(--ink-soft);

.bt-row .en{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted);

.bt-row .note{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);

.bt-row:hover .n,.bt-row:focus-visible .n{color:var(--accent);font-weight:700}
.bt-row:hover .zh,.bt-row:focus-visible .zh{color:var(--ink)}

.bt-action{position:relative;z-index:10;width:100%;max-width:940px;

.bt-btn{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;

/* ---------- 机框 / 计数 / 跳过 ---------- */
.bt-stepcount{position:absolute;left:46px;bottom:44px;z-index:14;

.bt-corner::before,.bt-corner::after{content:"";position:absolute;background:var(--hair)}
.bt-corner::before{width:100%;height:1px}
.bt-corner::after{width:1px;height:100%}
.bt-c-tl{left:26px;top:26px;transform:translate(-10px,-10px)}
.bt-c-tl::before,.bt-c-tl::after{top:0;left:0}
.bt-c-tr{right:26px;top:26px;transform:translate(10px,-10px)}
.bt-c-tr::before,.bt-c-tr::after{top:0;right:0}
.bt-c-bl{left:26px;bottom:26px;transform:translate(-10px,10px)}
.bt-c-bl::before,.bt-c-bl::after{bottom:0;left:0}
.bt-c-br{right:26px;bottom:26px;transform:translate(10px,10px)}
.bt-c-br::before,.bt-c-br::after{bottom:0;right:0}
.bt-frame.in .bt-corner{opacity:1;transform:none}
.bt-frame.in .bt-c-tr{transition-delay:90ms}
.bt-frame.in .bt-c-br{transition-delay:180ms}
.bt-frame.in .bt-c-bl{transition-delay:270ms}
/* 一次性扫描线 */
.bt-scanline{position:absolute;left:0;right:0;height:130px;z-index:12;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(10,10,10,.06),transparent)}
.bt-scanline.go{animation:btScan 2400ms cubic-bezier(.42,0,.58,1) 1}
@keyframes btScan{0%{opacity:0;top:-18%}12%{opacity:1}88%{opacity:1}100%{opacity:0;top:108%}}

/* ---------- 收束:过曝 → 光晕 → 暗角 → 让位 ---------- */
.bt-flash{position:absolute;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none}
#boot.wash .bt-flash{animation:btFlash 820ms cubic-bezier(.2,.7,.2,1) forwards}
@keyframes btFlash{0%{opacity:0}14%{opacity:.92}40%{opacity:.6}70%{opacity:.2}100%{opacity:0}}
.bt-bloom{position:absolute;inset:0;z-index:38;pointer-events:none;opacity:0;
  background:radial-gradient(58% 42% at 50% 46%,rgba(255,255,255,.9),rgba(255,255,255,0) 72%)}
#boot.wash .bt-bloom{animation:btBloom 900ms cubic-bezier(.22,.68,.2,1) forwards}
@keyframes btBloom{0%{opacity:0;transform:scale(.7)}26%{opacity:.85}100%{opacity:0;transform:scale(1.4)}}
.bt-vignette{position:absolute;inset:0;z-index:36;pointer-events:none;opacity:0;
  transition:opacity 700ms ease;
  background:radial-gradient(120% 100% at 50% 50%,transparent 42%,rgba(10,10,10,.3) 100%)}
#boot.wash .bt-vignette{opacity:1}
/* 收束时内容整体轻微后撤,像合上卷宗 */
#boot.wash .bt-card-wrap{transform:scale(1.018);opacity:.2;
  transition:transform 700ms var(--ease-out),opacity 700ms ease}

/* ---------- 窄屏 ---------- */
@media (max-width:820px){
  /* 分组结构在窄屏上丢掉英文层与时长,否则标题会被挤到折行 */
  .bt-ghead{grid-template-columns:minmax(0,1fr) auto 14px}
  .bt-ghead .gk{display:none}
  .bt-ghead .gn{font-size:9px}
  .bt-row{grid-template-columns:26px minmax(0,1fr) 14px}
  .bt-row .note{display:none}
  .bt-row .en{display:none}
  .bt-brand{left:24px;top:24px}
  .bt-stepcount{left:24px;bottom:30px}
  .bt-skip{right:24px;top:26px}
  .bt-c-tl,.bt-c-tr,.bt-c-bl,.bt-c-br{display:none}
  .bt-card-wrap{padding:72px 22px 40px;justify-content:flex-start}
  .bt-head{margin-top:6vh}
}
/* 尊重「减少动态效果」 */
@media (prefers-reduced-motion:reduce){
  #boot *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* 深度色主题(可选):同一套版式换暗底板 */
body.deep{--bg:#0b0b0c;--bg-2:#131315;--paper:#151517;--ink:#f2f1ee;--ink-soft:#cfcecb;
  --muted:#85847f;--hair:rgba(255,255,255,.18);--hair-soft:rgba(255,255,255,.07);
  background:linear-gradient(168deg,#131315,#0b0b0c)}

/* ============================================================================
 * 归档工作面 —— 开场序列之后的常驻界面
 * 语汇延续:发丝线 / 等宽字距元数据 / 橙色定位 / 分段进度 / 深色工作台
 * ========================================================================== */
#app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:2}
#app.hidden{visibility:hidden}

/* ---------- 顶部档案条 ---------- */
#top{
  display:flex;align-items:center;gap:18px;padding:10px 22px;flex:0 0 auto;
  background:rgba(255,255,255,.5);
  border-bottom:1px solid var(--hair);
  backdrop-filter:blur(2px);
}
#top .brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
#top .brand .mark{
  width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;
}
#top .brand .mark img{width:30px;height:30px;display:block;object-fit:contain}
#top .brand .txt-1{font-family:var(--din);font-weight:700;font-size:14.5px;letter-spacing:.14em;line-height:1.2}
#top .brand .txt-2{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--muted);margin-top:1px}
#top .brand .lock{display:flex;align-items:center;gap:6px}

/* 分段进度(12 格,对应 12 幕/12 关) */
#slats{display:flex;align-items:center;gap:3px;flex:0 1 auto;min-width:0}
.slat{
  width:14px;height:5px;background:var(--hair-soft);
  transition:width 320ms var(--ease-out),background 320ms ease;
}
.slat.past{background:var(--ink);opacity:.32}
.slat.on{width:30px;background:var(--accent)}
#progMeta{margin-left:12px;flex:0 0 auto}
#top .spacer{flex:1}
.tbtn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);
  border:1px solid var(--hair);padding:6px 11px;transition:var(--t);white-space:nowrap;
  text-transform:uppercase;
}
.tbtn:hover{color:var(--ink);border-color:var(--ink);background:rgba(255,255,255,.5)}
.tbtn.acc{border-color:var(--accent);color:var(--accent)}
.tbtn.acc:hover{background:var(--accent);color:#fff}

/* ---------- 三栏主体 ---------- */
#main{display:grid;grid-template-columns:264px minmax(0,1fr) minmax(0,1.06fr);
  flex:1 1 auto;min-height:0}

/* ---------- 左:阶段索引 ---------- */
#nav{
  background:rgba(255,255,255,.34);border-right:1px solid var(--hair);
  overflow-y:auto;padding:16px 0 60px;min-height:0;
}
.navGroup{padding:0 0 6px}
.navGroup h4{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--muted);padding:12px 18px 7px;font-weight:400;
}
.navItem{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  padding:8px 18px 8px 15px;color:var(--ink-soft);font-size:12.5px;line-height:1.45;
  transition:var(--t);position:relative;border-left:2px solid transparent;
}
.navItem:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.navItem.active{background:rgba(255,255,255,.8);color:var(--ink);border-left-color:var(--accent)}
.navItem .n{
  flex:0 0 auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--muted);padding-top:2px;min-width:20px;
}
.navItem.active .n{color:var(--accent);font-weight:700}
.navItem.done .n{color:var(--ok)}
.navItem .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navItem.active .lbl{font-weight:600}
.navFoot{
  margin:18px 18px 0;padding-top:14px;border-top:1px solid var(--hair);
  display:flex;flex-direction:column;gap:5px;
}
.navFoot div{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted)}

/* ---------- 中:卷宗正文 ---------- */
#center{overflow-y:auto;padding:30px 44px 90px;min-height:0;position:relative}
.docHead{margin-bottom:22px}
.docHead .line1{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.docHead .actNo{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--accent);
}
.docHead .dash{flex:0 0 auto;width:34px;height:1px;background:var(--hair)}
.docHead h1{
  font-family:var(--din);font-weight:700;font-size:clamp(23px,2.5vw,31px);
  letter-spacing:.03em;line-height:1.24;color:var(--ink);
}
.docHead .en{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--muted);
  margin-top:7px;
}
.docMeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}

/* 章节标题 */
h2.sec{
  display:flex;align-items:center;gap:11px;margin:30px 0 12px;
  font-family:var(--din);font-weight:700;font-size:14px;letter-spacing:.12em;
  color:var(--ink);text-transform:uppercase;
}
h2.sec::before{content:"";flex:0 0 auto;width:3px;height:14px;background:var(--accent)}
h2.sec .zh{font-family:var(--zh);letter-spacing:.04em;text-transform:none;font-weight:600}
h2.sec .en{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--muted);font-weight:400}
p.para{color:var(--ink-soft);margin:10px 0;font-size:13.5px;line-height:1.85}
p.para strong,p.para b{color:var(--ink)}
.kw{color:var(--accent);font-family:var(--mono);font-weight:600}
.fn{color:#8a4bd0;font-family:var(--mono)}
.str{color:#2f7d4f;font-family:var(--mono)}
.num{color:#0b6ea8;font-family:var(--mono)}

/* 卡片:纸面 + 左侧色条 */
.card{
  background:var(--paper);border:1px solid var(--hair);
  padding:14px 17px;margin:13px 0;position:relative;
  box-shadow:0 1px 2px rgba(10,10,10,.04);
}
.card:hover{border-color:rgba(10,10,10,.26)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--hair)}
.card.key::before{background:var(--accent)}
.card.tip::before{background:var(--glitch-b)}
.card.warn::before{background:var(--warn)}
.card h3{
  font-family:var(--zh);font-size:13px;font-weight:700;margin-bottom:7px;
  display:flex;align-items:center;gap:8px;color:var(--ink);
}
.card h3 .ico{font-size:14px;filter:grayscale(.15)}
.card p,.card li{color:var(--ink-soft);font-size:13px;line-height:1.8}
.card ul{margin:5px 0 0 17px}
.card li{margin:4px 0}
.card li::marker{color:var(--accent)}

/* 速查表 */
table.cheat{width:100%;border-collapse:collapse;font-size:12.5px;margin:12px 0;
  background:var(--paper);border:1px solid var(--hair)}
table.cheat th,table.cheat td{
  border-bottom:1px solid var(--hair-soft);padding:7px 11px;text-align:left;vertical-align:top;
}
table.cheat th{
  background:rgba(10,10,10,.04);font-family:var(--mono);font-size:9.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:400;
}
table.cheat td:first-child{font-family:var(--mono);color:var(--accent);white-space:nowrap;width:38%}
table.cheat tr:last-child td{border-bottom:none}
table.cheat tr:hover td{background:rgba(255,255,255,.7)}

/* 讲解区代码块(纸面上的墨块) */
pre.demo{
  background:var(--deep);color:var(--deep-ink);padding:12px 15px;margin:10px 0;
  font-size:12.5px;line-height:1.75;overflow-x:auto;
  border-left:2px solid var(--accent);
}
pre.demo .c{color:#6f6d68;font-style:italic}
pre.demo .k{color:#ff9f5a;font-weight:600}
pre.demo .s{color:#8fd98a}
pre.demo .n{color:#5ec8d8}
pre.demo .f{color:#b98cf0}
pre.demo .o{color:#cfcdc8}
pre.demo .out{color:#8d8b86}

/* 编号步骤 */
ol.steps{margin:10px 0 10px 4px;list-style:none;counter-reset:st}
ol.steps li{
  counter-increment:st;position:relative;padding:6px 0 6px 34px;
  color:var(--ink-soft);font-size:13px;line-height:1.8;
}
ol.steps li::before{
  content:counter(st,decimal-leading-zero);position:absolute;left:0;top:7px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--accent);
  border:1px solid var(--hair);padding:1px 5px;
}

/* 卷宗底部操作 */
.lvFoot{
  display:flex;gap:9px;align-items:center;margin-top:34px;padding-top:20px;
  border-top:1px solid var(--hair);flex-wrap:wrap;
}
.btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:9px 16px;border:1px solid var(--hair);color:var(--ink-soft);
  background:rgba(255,255,255,.4);transition:var(--t);
}
.btn:hover{color:var(--ink);border-color:var(--ink);background:#fff;transform:translateY(-1px)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:var(--accent);border-color:var(--accent)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:9.5px}
.pill{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;padding:3px 8px;
  border:1px solid var(--hair);color:var(--muted);
}
.pill.okP{border-color:var(--ok);color:var(--ok)}

/* ---------- 右:工作台 ---------- */
#right{
  background:var(--deep);color:var(--deep-ink);border-left:1px solid var(--hair);
  display:flex;flex-direction:column;min-height:0;min-width:0;
}
#rtabs{display:flex;gap:0;flex:0 0 auto;border-bottom:1px solid var(--deep-hair);
  background:var(--deep-2)}
.rtab{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--deep-muted);
  padding:11px 15px;border-bottom:2px solid transparent;transition:var(--t);
  text-transform:uppercase;
}
.rtab:hover{color:var(--deep-ink)}
.rtab.active{color:var(--deep-ink);border-bottom-color:var(--accent);background:var(--deep-3)}
#rbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 18px 54px}
.tabPane{display:none}
.tabPane.active{display:block;animation:fadeUp .3s var(--ease-out) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 编辑器 */
.edWrap{border:1px solid var(--deep-hair);background:#060606}
.edBar{
  display:flex;align-items:center;gap:8px;padding:6px 11px;
  background:var(--deep-2);border-bottom:1px solid var(--deep-hair);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--deep-muted);
}
.edBar .dots{display:flex;gap:5px}
.edBar .dots i{width:7px;height:7px;border-radius:50%;display:block;background:#2a2a29}
.edBar .dots i:nth-child(1){background:#c0392b}
.edBar .dots i:nth-child(2){background:#b4770a}
.edBar .dots i:nth-child(3){background:#2f7d4f}
.edBar .spacer{flex:1}
.edArea{display:flex;position:relative;font-family:var(--mono)}
#lineNums{
  flex:0 0 auto;padding:10px 8px 10px 11px;text-align:right;color:#4a4845;
  user-select:none;background:#030303;border-right:1px solid var(--deep-hair-soft);
  font-size:12.5px;line-height:1.62;min-width:38px;
}
#lineNums div{transition:color .15s}
#lineNums div.cur{color:var(--accent);font-weight:700}
#code{
  flex:1;min-height:210px;padding:10px 13px;background:transparent;color:var(--deep-ink);
  border:none;outline:none;resize:vertical;font-family:var(--mono);font-size:13px;
  line-height:1.62;tab-size:4;white-space:pre;overflow-wrap:normal;overflow-x:auto;
}
#code::selection{background:rgba(255,117,0,.3)}

/* 逐行留痕列 */
#birdsEye{
  flex:0 0 162px;overflow:hidden;background:#0c0c0b;
  border-left:1px solid var(--deep-hair-soft);
}
#birdsEye.off{display:none}
.beRow{
  display:flex;align-items:center;gap:5px;padding:0 7px;overflow:hidden;
  font-family:var(--mono);font-size:10.5px;line-height:1;box-sizing:border-box;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.beRow.cur{background:rgba(255,117,0,.16);box-shadow:inset 2px 0 0 var(--accent)}
.beRow.hasVars{background:rgba(255,255,255,.028)}
.beRow .beEmpty{color:#2a2a29}
.beVar{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px;flex:0 0 auto}
.beVar b{color:var(--t-int);font-weight:600}
.beVar i{color:var(--accent);font-style:normal}
.beMore{color:var(--deep-muted);font-size:9.5px;flex:0 0 auto}
.beGuess{
  flex:0 0 auto;width:15px;height:15px;cursor:pointer;
  border:1px solid var(--deep-hair);background:var(--deep-3);color:var(--deep-muted);
  font-size:10px;line-height:1;padding:0;display:grid;place-items:center;
  font-family:var(--mono);transition:var(--t);border-radius:0;
}
.beGuess:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.18)}
.beGuess.right{background:rgba(47,125,79,.3);border-color:#4ea86e;color:#8fd98a}
.beGuess.wrong{background:rgba(192,57,43,.3);border-color:#d05a4a;color:#ffb4ae}
.beGuess.right::after{content:"✓"}
.beGuess.wrong::after{content:"✗"}

/* 预测气泡 */
.guessPop{
  position:fixed;z-index:300;width:266px;background:var(--deep-3);
  border:1px solid var(--accent);padding:12px 13px;box-shadow:0 18px 44px rgba(0,0,0,.55);
  font-size:12.5px;animation:fadeUp .18s var(--ease-out) both;
}
.guessPop .gq{color:var(--deep-ink);margin-bottom:9px;line-height:1.6;font-family:var(--zh)}
.guessPop .gopts{display:flex;flex-direction:column;gap:5px}
.guessPop button{
  text-align:left;padding:7px 10px;background:var(--deep-2);
  border:1px solid var(--deep-hair);color:#cfcdc8;font-family:var(--mono);font-size:11.5px;
  transition:var(--t);
}
.guessPop button:hover{border-color:var(--accent);color:#fff;transform:translateX(2px)}
.guessPop .gres{margin-top:9px;padding:8px 10px;font-size:12px;line-height:1.65;font-family:var(--zh)}
.guessPop .gres.right{background:rgba(47,125,79,.18);border:1px solid rgba(78,168,110,.5);color:#8fd98a}
.guessPop .gres.wrong{background:rgba(192,57,43,.16);border:1px solid rgba(208,90,74,.5);color:#ffb4ae}
.guessPop .gwhy{margin-top:6px;color:#cfcdc8;font-size:11.5px}

/* 运行条 */
.runBar{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap}
.runBar .btn{
  background:var(--deep-3);border-color:var(--deep-hair);color:#cfcdc8;
}
.runBar .btn:hover{background:#262625;border-color:var(--accent);color:#fff}
.runBar .btn.pri{background:var(--accent);border-color:var(--accent);color:#0a0a0a;font-weight:700}
.runBar .btn.pri:hover{filter:brightness(1.1)}
.kbdhint{font-family:var(--mono);font-size:9px;opacity:.6;letter-spacing:.1em}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--deep-hair);
  padding:0 5px;color:#cfcdc8}

/* 面板标题 */
.panelTitle{
  display:flex;align-items:center;gap:9px;margin:14px 0 8px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--deep-muted);
}
.panelTitle .spacer{flex:1}
.panelTitle::before{content:"";width:2px;height:11px;background:var(--accent);flex:0 0 auto}

/* 输出 */
#out{
  background:#060606;border:1px solid var(--deep-hair);padding:12px 14px;
  font-family:var(--mono);font-size:12.5px;line-height:1.72;
  min-height:86px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
  color:var(--deep-ink);
}
#out .err{color:#ff8f7a}
#out .okmsg{color:#8fd98a}
#out .dim{color:var(--deep-muted)}
#out .caret{display:inline-block;width:7px;height:14px;background:var(--accent);
  vertical-align:-2px;animation:btBlink 1s steps(2) infinite}

/* 可视化舞台 */
#stage{
  position:relative;background:#070707;border:1px solid var(--deep-hair);
  padding:14px;min-height:158px;overflow:hidden;color:var(--deep-ink);
}
.gridBg{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:26px 26px}
.stageInner{position:relative;z-index:1}

/* 变量盒子 */
.varGrid{display:flex;flex-wrap:wrap;gap:9px}
.vbox{
  min-width:74px;padding:7px 11px 9px;background:var(--deep-2);
  border:1px solid var(--deep-hair);position:relative;transition:var(--t);
}
.vbox .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--deep-muted)}
.vbox .v{font-family:var(--mono);font-size:13.5px;font-weight:700;margin-top:2px;word-break:break-all;max-width:220px}
.vbox .ty{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:9px;opacity:.6}
.vbox.t-str{border-color:rgba(143,217,138,.45)} .vbox.t-str .v{color:var(--t-str)}
.vbox.t-int{border-color:rgba(94,200,216,.45)} .vbox.t-int .v{color:var(--t-int)}
.vbox.t-float{border-color:rgba(185,140,240,.45)} .vbox.t-float .v{color:var(--t-float)}
.vbox.t-bool{border-color:rgba(255,143,168,.45)} .vbox.t-bool .v{color:var(--t-bool)}
.vbox.t-list{border-color:rgba(255,179,71,.45)} .vbox.t-list .v{color:var(--t-list)}
.vbox.t-dict{border-color:rgba(111,168,255,.45)} .vbox.t-dict .v{color:var(--t-dict)}
.vbox.t-none{border-color:var(--deep-hair);opacity:.75}
@keyframes vPop{0%{transform:scale(1)}35%{transform:scale(1.14) translateY(-4px)}100%{transform:scale(1)}}
.vbox.changed{animation:vPop .5s cubic-bezier(.34,1.56,.64,1)}
.vbox.newborn::after{content:"new";position:absolute;top:-8px;right:-6px;
  font-family:var(--mono);font-size:8.5px;background:var(--accent);color:#0a0a0a;
  padding:1px 5px;font-weight:700}

/* 粒子 */
.particle{position:absolute;font-family:var(--mono);font-size:13px;font-weight:800;
  color:var(--accent);pointer-events:none;z-index:9;text-shadow:0 0 14px rgba(255,117,0,.7)}

/* 调用栈 */
.stackWrap{display:flex;flex-direction:column-reverse;gap:6px}
.frame{border:1px solid var(--deep-hair);border-left:2px solid var(--t-dict);
  padding:7px 11px;background:var(--deep-2);animation:frameIn .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes frameIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.frame.top{border-left-color:var(--accent)}
.frame .fname{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
.frame .fargs{font-family:var(--mono);font-size:11px;color:#cfcdc8;margin-top:3px}
.frame .fret{font-family:var(--mono);font-size:11px;color:#8fd98a;margin-top:3px}

/* 流程图 */
.flowRow{display:flex;gap:11px;align-items:stretch;flex-wrap:wrap}
.node{border:1px solid var(--deep-hair);padding:10px 14px;min-width:104px;background:var(--deep-2);
  text-align:center;transition:var(--t)}
.node .nt{font-family:var(--mono);font-size:10px;color:var(--deep-muted)}
.node .nv{font-family:var(--mono);font-size:12.5px;font-weight:700;margin-top:3px}
.node.hit{border-color:var(--accent);background:rgba(255,117,0,.1)}
.node.dimmed{opacity:.34}
.node.true .nv{color:#8fd98a} .node.false .nv{color:#ff8f7a}
.arrow{display:flex;align-items:center;color:var(--deep-hair);font-size:18px;padding:0 2px}
.arrow.lit{color:var(--accent);animation:slideR .6s ease}
@keyframes slideR{from{transform:translateX(-7px);opacity:.3}to{transform:none;opacity:1}}

/* 循环状态机 */
.loopBox{border:1px solid var(--deep-hair);padding:12px;background:var(--deep-2)}
.loopHead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pillVar{font-family:var(--mono);font-size:12.5px;padding:6px 13px;
  background:rgba(94,200,216,.12);border:1px solid rgba(94,200,216,.45);color:var(--t-int);font-weight:700}
.pillVar.jump{animation:vPop .5s cubic-bezier(.34,1.56,.64,1)}
.cells{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cell{width:42px;height:42px;display:grid;place-items:center;font-family:var(--mono);
  font-size:13.5px;font-weight:700;background:var(--deep-3);border:1px solid var(--deep-hair);
  color:var(--deep-muted);transition:var(--t)}
.cell.visited{background:rgba(111,168,255,.14);border-color:rgba(111,168,255,.5);color:var(--t-dict)}
.cell.cur{background:var(--accent);color:#0a0a0a;border-color:var(--accent);transform:translateY(-3px) scale(1.06)}
.cell.out{background:rgba(143,217,138,.16);border-color:rgba(143,217,138,.5);color:var(--t-str)}
.track{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 9px;background:var(--deep-3);
  border:1px solid var(--deep-hair);color:#cfcdc8;animation:chipIn .3s cubic-bezier(.34,1.56,.64,1) both}
@keyframes chipIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* 序列 / 字典 */
.seqWrap{display:flex;gap:7px;align-items:flex-end;flex-wrap:wrap}
.seqItem{min-width:52px;overflow:hidden;border:1px solid var(--deep-hair);background:var(--deep-2);
  text-align:center;animation:chipIn .3s both}
.seqItem .idx{font-family:var(--mono);font-size:10px;color:var(--deep-muted);padding:2px 0;
  background:var(--deep-3);border-bottom:1px solid var(--deep-hair-soft)}
.seqItem .val{font-family:var(--mono);font-size:13px;padding:8px 10px;color:var(--t-list)}
.seqItem.hit{border-color:var(--accent)}
.dictWrap{display:flex;flex-direction:column;gap:7px}
.dictRow{display:flex;align-items:center;gap:8px;animation:chipIn .3s both}
.dictRow .dk{font-family:var(--mono);font-size:12px;padding:5px 11px;
  background:rgba(111,168,255,.13);border:1px solid rgba(111,168,255,.45);color:var(--t-dict);
  min-width:82px;text-align:center}
.dictRow .arrow2{color:var(--deep-hair);font-family:var(--mono)}
.dictRow .dv{font-family:var(--mono);font-size:12px;padding:5px 11px;background:var(--deep-3);
  border:1px solid var(--deep-hair);color:var(--deep-ink)}
.dictRow.hit .dv{border-color:var(--accent);color:var(--accent)}

/* 控制条 */
.ctrl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:11px 0}
.ctrl .spacer{flex:1}
.ctrl .btn{background:var(--deep-3);border-color:var(--deep-hair);color:#cfcdc8}
.ctrl .btn:hover{background:#262625;border-color:var(--accent);color:#fff}
.ctrl .btn.acc{background:var(--accent);border-color:var(--accent);color:#0a0a0a}
input[type=range]{-webkit-appearance:none;appearance:none;width:100px;height:3px;background:var(--deep-hair)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--accent);cursor:pointer}
label.inl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--deep-muted);
  display:inline-flex;align-items:center;gap:7px}

/* 内存模型图 */
#memWrap{display:flex;gap:0;align-items:flex-start;position:relative;min-height:140px}
.memCol{display:flex;flex-direction:column;gap:7px;position:relative;z-index:2}
.memCol.vars{flex:0 0 124px}
.memCol.heap{flex:0 0 172px;margin-left:66px}
.memHead{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--deep-muted);margin-bottom:5px}
.memBox{border:1px solid var(--deep-hair);background:var(--deep-2);padding:6px 9px;
  font-family:var(--mono);font-size:11.5px;line-height:1.5;transition:var(--t)}
.memBox .nm{color:var(--t-int);font-weight:700}
.memBox .vv{color:var(--accent)}
.memBox .ty{color:var(--deep-muted);font-size:9px;margin-left:4px}
.memBox.ref{border-color:rgba(255,117,0,.5);background:rgba(255,117,0,.06)}
.memObj{border:1px solid rgba(111,168,255,.5);background:rgba(111,168,255,.07);
  padding:6px 9px;font-family:var(--mono);font-size:11.5px;line-height:1.55;transition:var(--t)}
.memObj.alias{border-color:var(--t-bool);background:rgba(255,143,168,.09)}
.memObj .oid{color:var(--accent);font-weight:700;font-size:10px}
.memObj .oitems{color:#cfcdc8;word-break:break-all}
.memNote{font-family:var(--zh);font-size:11.5px;color:#ffb4ae;margin-top:8px;padding:7px 10px;
  background:rgba(255,143,168,.08);border:1px solid rgba(255,143,168,.3);line-height:1.65}
.memCell{display:inline-block;margin:1px 3px 1px 0;padding:1px 5px;background:var(--deep-3);
  border:1px solid var(--deep-hair)}
.memCell i{color:var(--deep-muted);font-style:normal;font-size:9px}
.memCell b{color:var(--accent);font-weight:600}

/* 练习 / 检测 */
.exItem{border:1px solid var(--deep-hair);background:var(--deep-2);padding:12px 14px;margin-bottom:10px;
  transition:var(--t)}
.exItem:hover{border-color:rgba(255,255,255,.26)}
.exItem .qtxt{font-family:var(--zh);font-size:13px;margin-bottom:9px;display:flex;gap:8px;color:var(--deep-ink)}
.exItem .qno{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--accent);
  border:1px solid var(--deep-hair);padding:1px 5px;height:18px}
.exItem.correct{border-color:rgba(78,168,110,.5)}
.exItem.wrong{border-color:rgba(208,90,74,.45)}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{text-align:left;padding:8px 11px;background:var(--deep-3);border:1px solid var(--deep-hair);
  font-family:var(--mono);font-size:12px;color:#cfcdc8;transition:var(--t)}
.choice:hover{border-color:var(--accent);color:#fff;transform:translateX(3px)}
.choice.good{border-color:#4ea86e;color:#8fd98a;background:rgba(47,125,79,.16)}
.choice.bad{border-color:#d05a4a;color:#ffb4ae;background:rgba(192,57,43,.14)}
.exFb{font-family:var(--zh);font-size:12.5px;margin-top:9px;padding:9px 11px;display:none;line-height:1.75}
.exFb.show{display:block;animation:fadeUp .25s var(--ease-out) both}
.exFb.good{background:rgba(47,125,79,.14);border:1px solid rgba(78,168,110,.4);color:#8fd98a}
.exFb.bad{background:rgba(192,57,43,.12);border:1px solid rgba(208,90,74,.4);color:#ffb4ae}

/* 任务清单 */
.taskItem{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;background:var(--deep-2);
  border:1px solid var(--deep-hair);margin-bottom:7px;font-family:var(--zh);font-size:12.5px;transition:var(--t)}
.taskItem .tick{flex:0 0 auto;width:15px;height:15px;border:1px solid var(--deep-hair);
  display:grid;place-items:center;font-size:10px;color:transparent;margin-top:2px}
.taskItem.done{border-color:rgba(78,168,110,.4)}
.taskItem.done .tick{background:#2f7d4f;border-color:#2f7d4f;color:#0a0a0a}
.taskItem.done .ttxt{color:var(--deep-muted);text-decoration:line-through}
.taskItem .ttxt{color:#cfcdc8;flex:1;line-height:1.7}
.taskItem .ttxt code{color:var(--accent)}

/* 速查卡弹窗(纸面版) */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);backdrop-filter:blur(3px);
  z-index:200;display:none;place-items:center;padding:26px}
.overlay.show{display:grid;animation:fadeUp .2s var(--ease-out) both}
.modal{background:var(--paper);border:1px solid var(--hair);max-width:1020px;width:100%;
  max-height:86vh;display:flex;flex-direction:column;box-shadow:0 30px 90px rgba(0,0,0,.4)}
.modalHead{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--hair)}
.modalHead h2{font-family:var(--din);font-size:16px;letter-spacing:.1em;flex:1;font-weight:700}
.modalBody{padding:20px;overflow-y:auto}
.modalBody h3{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);margin:20px 0 9px}
.modalBody h3:first-child{margin-top:0}
.x{width:28px;height:28px;display:grid;place-items:center;font-size:16px;color:var(--muted);
  border:1px solid transparent;transition:var(--t)}
.x:hover{border-color:var(--hair);color:var(--err)}

/* ---------- 知识图谱网络 ----------
   语汇延续:暖白纸面 / 发丝线 / 橙色定位。
   刻意不用高饱和色块,节点用「细环 + 实心点 + 等宽编号」的档案风格。 */
.modal.wide{max-width:1180px}
#graphBody{padding:0;display:flex;flex-direction:column;overflow:hidden}
#graphStage{flex:1 1 auto;overflow:auto;min-height:0;background:
  linear-gradient(var(--hair-soft) 1px,transparent 1px) 0 0/100% 24px,
  linear-gradient(90deg,var(--hair-soft) 1px,transparent 1px) 0 0/24px 100%,
  var(--bg-2)}
#graphSvg{display:block;min-height:420px}
#graphFoot{flex:0 0 auto;display:flex;gap:18px;flex-wrap:wrap;padding:9px 20px;
  border-top:1px solid var(--hair);background:var(--paper)}
.gHint{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase}
.gHint::before{content:"·";margin-right:7px;color:var(--accent)}
/* 连线:发丝灰,悬停时该节点的邻边变橙并加粗 */
.gEdges path{fill:none;stroke:rgba(10,10,10,.22);stroke-width:1.1;transition:stroke .18s,stroke-width .18s}
.gEdges path.hl{stroke:var(--accent);stroke-width:2}
.gEdges path.dim{stroke:rgba(10,10,10,.07)}
/* 节点 */
.gNode .gDot{stroke:var(--paper);stroke-width:2.5;transition:r .16s var(--ease-out)}
.gNode .gHalo{fill:transparent;stroke:transparent;stroke-width:1}
.gNode .gNum{font-family:var(--mono);font-size:11px;font-weight:700;fill:#fff;
  letter-spacing:.04em;pointer-events:none}
.gNode .gLabel{font-family:var(--zh);font-size:11px;fill:var(--ink);pointer-events:none}
.gNode .gGroup{font-family:var(--mono);font-size:8px;letter-spacing:.1em;
  fill:var(--muted);pointer-events:none}
.gNode:hover .gDot{r:25}
.gNode:hover .gHalo{stroke:var(--accent);stroke-dasharray:3 3}
.gNode.hl .gHalo{stroke:var(--accent);stroke-width:1.5}
.gNode.dim{opacity:.28}
.gNode{cursor:grab}
.gNode:active{cursor:grabbing}

/* 自测面板 */
.testRow{display:flex;align-items:center;gap:10px;padding:7px 11px;background:#fff;
  border:1px solid var(--hair);margin-bottom:5px;font-family:var(--mono);font-size:11.5px}
.testRow.pass{border-color:rgba(47,125,79,.4)}
.testRow.fail{border-color:rgba(192,57,43,.45);background:rgba(192,57,43,.05)}
.testRow .tag{font-size:9.5px;letter-spacing:.14em;padding:2px 7px;border:1px solid}
.testRow.pass .tag{border-color:var(--ok);color:var(--ok)}
.testRow.fail .tag{border-color:var(--err);color:var(--err)}
.testRow .nm{flex:1;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.testRow .dt{color:var(--muted);font-size:10px}
#testSummary{font-size:13px;padding:14px;border:1px solid var(--hair);background:#fff;margin-bottom:14px}
.bigNum{font-family:var(--din);font-size:26px;font-weight:700}

/* Toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:11px 20px;font-family:var(--zh);font-size:13px;
  z-index:300;opacity:0;transition:transform .35s var(--ease-out),opacity .35s;max-width:82vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{background:#2f7d4f}
#toast.err{background:#c0392b}

/* 底部状态条 */
#statusbar{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:5px 22px;
  border-top:1px solid var(--hair);background:rgba(255,255,255,.42);
}
#statusbar div{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#statusbar .spacer{flex:1}

/* 一次性扫描线(工作面加载时) */
#wsScan{position:absolute;left:0;right:0;height:110px;z-index:60;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(10,10,10,.06),transparent)}
#wsScan.go{animation:btScan 2000ms cubic-bezier(.42,0,.58,1) 1}

/* 响应式 */
@media (max-width:1280px){
  #main{grid-template-columns:228px minmax(0,1fr) minmax(0,1fr)}
  #center{padding:24px 26px 80px}
  #slats{display:none}
}
@media (max-width:980px){
  #main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr)}
  #nav{display:flex;overflow-x:auto;overflow-y:hidden;padding:9px 10px;gap:7px;
    border-right:none;border-bottom:1px solid var(--hair)}
  .navGroup{padding:0;display:flex;gap:6px;align-items:center}
  .navGroup h4{display:none}
  .navItem{white-space:nowrap;width:auto;padding:6px 11px;border-left:none;
    border-bottom:2px solid transparent}
  .navItem.active{border-left:none;border-bottom-color:var(--accent)}
  .navFoot{display:none}
  #right{border-left:none;border-top:1px solid var(--hair)}
  #statusbar{display:none}
}
/* 尊重「减少动态效果」 */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>
</head>
<body>
<!-- ============================================================================
     开场:档案封面
     挂载点而已 —— 封面 DOM 由 boot.js 运行时生成,
     这样封面结构与封面逻辑始终在一起,替换时不会漏掉零件。
     ========================================================================= -->
<div id="boot"></div>
<!-- ============================================================================

<!-- ENGINE · 轻量 Python 解释器(自 python-1小时速成.html 原样搬运) -->
<script>
/* [BLOCK:ENGINE] 轻量 Python 解释器(自 python-1小时速成.html 原样搬运) */
/* ==========================================================================
   第 1 部分:轻量 Python 解释器引擎
   --------------------------------------------------------------------------
   [BLOCK:ENGINE]   ← 供 tools/selftest.node.js 定位脚本块,勿删
   --------------------------------------------------------------------------
   设计要点(交接时重点看这里):
   1) 三段式:tokenizer(缩进感知) → parser(递归下降 → AST) → Interpreter(树遍历)
   2) 全程不使用 eval / Function,因此断网、无 CSP 风险,且能拦住所有语法
   3) 关键设计:解释器每执行一条语句就产出一条「执行轨迹 trace」,
      字段 { i, line, src, vars, outLen, stack },动画层直接消费它 ——
      同一套引擎既驱动代码运行,也驱动所有交互动画。
   4) 只覆盖课程语法子集,超范围写法给出中文提示而非崩溃。
   ========================================================================== */
(function (global) {
  'use strict';

  /* ---------- 常量 ---------- */
  var KEYWORDS = ['and','as','assert','break','class','continue','def','del','elif',
    'else','except','False','finally','for','from','global','if','import','in','is',
    'lambda','None','nonlocal','not','or','pass','raise','return','True','try','while',
    'with','yield'];
  var KW = Object.create(null);
  KEYWORDS.forEach(function (k) { KW[k] = 1; });

  // 运算符按长度倒序,保证 >= 先于 > 匹配
  var OPERATORS = ['**=','//=','==','!=','<=','>=','->','**','//','+=','-=','*=','/=',
    '%=','<','>','=','+','-','*','/','%','&','|','^','(',')','[',']','{','}',',',':',';','.'];

  /* 执行步数上限 —— 既是死循环保护,也是「教学代码复杂度」的天花板。
     [!] 这个值定小了会误伤正规算法:第二层的空间分析里,
        莫兰指数 + 置换检验是 O(n² × 置换次数) 量级。
        以 n=144 个网格、199 次置换估算,内层操作约 4×10⁶ 步 ——
        原来的 120000 会让**正确且必要**的课程代码在跑到一半时被中止,
        学员看到的是"步数超限"而不是结果。
     所以放宽到 150 万:足够容纳置换检验这类正规重计算,
     同时真正写坏的死循环仍然会在几秒内被拦住。
     另外课程代码应按调研建议压住数据规模(网格  50×50、置换  199 次),
     不要靠抬上限来硬撑。 */
  /* [修订] 第二层 L30 用「多起点 k-means」避免局部最优,约需 300 万步,
     所以上限从 150 万放宽到 500 万;真正的死循环仍会在几秒内被拦住。 */
  var MAX_STEPS = 5000000;    // 执行步数上限,防死循环
  var MAX_LOOP  = 400000;     // 单循环保护

  /* ---------- 扩展机制 ----------
     TYPEHINTS : [类型名, 识别函数] —— 让 typeName/repr 认识扩展包引入的新类型
     BUILTIN_HOOKS : [函数(interp)] —— 每次 run 前由扩展包往作用域里注入内置名
     这样第二阶段课程(数组/DataFrame/空间计算)可以独立加载,不动引擎核心。 */
  var TYPEHINTS = [];
  var BUILTIN_HOOKS = [];
  var EXTENSIONS = [];
  /* EXT_METHODS : [{ match(obj), getAttr(obj,name,line), call(obj,name,args,kw,line) }]
     扩展类型的属性读取与方法调用统一从这里分发。 */
  var EXT_METHODS = [];
  /* 扩展包声明的额外模块名 —— 只用于报错文案,让「可用模块」提示保持准确 */
  var EXTRA_MODULE_NAMES = [];
  /* EXT_OPS / EXT_CMP : [函数(op, l, r, line) -> 结果 或 undefined(表示不接管)]
     扩展类型参与算术/比较运算时从这里分发。 */
  var EXT_OPS = [];
  var EXT_CMP = [];

  /* ---------- 错误类型 ---------- */
  function PyError(kind, msg, line) {
    this.name = kind;
    this.kind = kind;
    this.message = msg;
    this.line = line || null;
    this.isPyError = true;
  }
  PyError.prototype = Object.create(Error.prototype);
  PyError.prototype.toString = function () {
    return this.kind + ': ' + this.message;
  };
  function perr(kind, msg, line) { return new PyError(kind, msg, line); }

  /* ==========================================================================
     1.1 词法分析器 —— 把源码变成带缩进标记的 token 流
     每个 token: { type, value, line, col }
     type  num | str | fstr | name | kw | op | newline | indent | dedent | eof
     ========================================================================== */
  function tokenize(src) {
    var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    var out = [], indents = [0], depth = 0, openLine = null;

    for (var li = 0; li < lines.length; li++) {
      var raw = lines[li], lineNo = li + 1;

      // --- 计算本行缩进(整行空白/注释行不影响缩进栈) ---
      if (depth === 0) {
        var stripped = raw.replace(/^[ \t]+/, '');
        if (stripped === '' || stripped.charAt(0) === '#') continue;
        var ind = 0;
        for (var ci = 0; ci < raw.length; ci++) {
          if (raw.charAt(ci) === ' ') ind += 1;
          else if (raw.charAt(ci) === '\t') ind += 4;
          else break;
        }
        if (!openLine) {
          if (ind > indents[indents.length - 1]) {
            indents.push(ind);
            out.push({ type: 'indent', value: ind, line: lineNo, col: 0 });
          } else {
            while (ind < indents[indents.length - 1]) {
              indents.pop();
              out.push({ type: 'dedent', value: ind, line: lineNo, col: 0 });
            }
            if (ind !== indents[indents.length - 1]) {
              throw perr('IndentationError',
                '第 ' + lineNo + '行缩进不一致(用了 ' + ind + '个空格,同级代码应该用 ' +
                indents[indents.length - 1] + '个)。Python 用缩进表示代码层级,同一层的语句必须对齐。',
                lineNo);
            }
          }
        }
      }

      // --- 逐字符扫描 ---
      var i = 0, n = raw.length;
      while (i < n) {
        var ch = raw.charAt(i);
        if (ch === ' ' || ch === '\t') { i++; continue; }
        if (ch === '#') break;                          // 注释:跳到行尾

        // 前缀字符串 f"..." / r"..." / b"..."(必须先于「标识符」判断)
        if (/[A-Za-z_]/.test(ch) && i + 1 < n && (raw.charAt(i + 1) === '"' || raw.charAt(i + 1) === "'")) {
          var pre = ch.toLowerCase();
          if (pre === 'f' || pre === 'r' || pre === 'b') {
            var rp = scanString(raw, i + 1, raw.charAt(i + 1));
            if (rp.error) throw perr('SyntaxError', '第 ' + lineNo + '行:' + rp.error, lineNo);
            out.push({ type: pre === 'f' ? 'fstr' : 'str', value: rp.value, line: lineNo, col: i });
            i = rp.next;
            continue;
          }
        }
        // 普通字符串
        if (ch === '"' || ch === "'") {
          var res = scanString(raw, i, ch);
          if (res.error) throw perr('SyntaxError', '第 ' + lineNo + '行:' + res.error, lineNo);
          out.push({ type: 'str', value: res.value, line: lineNo, col: i });
          i = res.next;
          continue;
        }
        // 数字
        if (/[0-9]/.test(ch) || (ch === '.' && /[0-9]/.test(raw.charAt(i + 1) || ''))) {
          var m = /^[0-9]*\.?[0-9]+([eE][+-]?[0-9]+)?/.exec(raw.slice(i));
          if (!m) throw perr('SyntaxError', '第 ' + lineNo + '行:数字写法有误', lineNo);
          var txt = m[0];
          out.push({
            type: 'num',
            value: txt.indexOf('.') >= 0 || /[eE]/.test(txt) ? parseFloat(txt) : parseInt(txt, 10),
            isFloat: txt.indexOf('.') >= 0 || /[eE]/.test(txt),
            line: lineNo, col: i
          });
          i += txt.length;
          continue;
        }
        // 标识符 / 关键字
        if (/[A-Za-z_]/.test(ch)) {
          var m2 = /^[A-Za-z_][A-Za-z0-9_]*/.exec(raw.slice(i));
          var word = m2[0];
          out.push({ type: KW[word] ? 'kw' : 'name', value: word, line: lineNo, col: i });
          i += word.length;
          continue;
        }
        // 运算符
        var matched = null;
        for (var oi = 0; oi < OPERATORS.length; oi++) {
          if (raw.substr(i, OPERATORS[oi].length) === OPERATORS[oi]) { matched = OPERATORS[oi]; break; }
        }
        if (matched) {
          if (matched === '(' || matched === '[' || matched === '{') depth++;
          if (matched === ')' || matched === ']' || matched === '}') depth--;
          if (depth < 0) throw perr('SyntaxError', '第 ' + lineNo + '行:多余的 ' + matched, lineNo);
          openLine = depth > 0 ? lineNo : null;
          out.push({ type: 'op', value: matched, line: lineNo, col: i });
          i += matched.length;
          continue;
        }
        throw perr('SyntaxError',
          '第 ' + lineNo + '行:出现了本教学模拟器不认识的字符 "' + ch + '"', lineNo);
      }
      if (depth === 0) out.push({ type: 'newline', value: '\n', line: lineNo, col: n });
      else openLine = lineNo;
    }
    while (indents.length > 1) { indents.pop(); out.push({ type: 'dedent', value: 0, line: lines.length, col: 0 }); }
    out.push({ type: 'eof', value: null, line: lines.length + 1, col: 0 });
    return out;

    function scanString(text, startIdx, quote) {
      var j = startIdx + 1, buf = '';
      while (j < text.length) {
        var c = text.charAt(j);
        if (c === '\\') {
          var nx = text.charAt(j + 1);
          var map = { n: '\n', t: '\t', r: '\r', '\\': '\\', "'": "'", '"': '"', '0': '\0' };
          buf += (map[nx] !== undefined ? map[nx] : nx);
          j += 2; continue;
        }
        if (c === quote) return { value: buf, next: j + 1 };
        buf += c; j++;
      }
      return { error: '字符串没有闭合(缺少结尾的 ' + quote + ')', next: text.length };
    }
  }

  /* ==========================================================================
     1.2 语法分析器 —— 递归下降,产出 AST
     语句节点 type: Assign | AugAssign | Expr | Print(走 Expr) | If | While | For |
                    FuncDef | ClassDef | Return | Break | Continue | Pass | Try
     表达式节点 type: Num | Str | FStr | Name | Bool | None | List | Dict | Tuple |
                     BinOp | UnaryOp | BoolOp | Compare | Call | Attr | Subscript
     ========================================================================== */
  function Parser(tokens, srcLines) {
    this.t = tokens; this.p = 0; this.lines = srcLines || [];
  }
  Parser.prototype = {
    /* --- 基础工具 --- */
    peek: function (k) { return this.t[this.p + (k || 0)]; },
    at: function (type, value) {
      var tk = this.t[this.p];
      if (!tk || tk.type !== type) return false;
      return value === undefined ? true : tk.value === value;
    },
    atOp: function (v) { return this.at('op', v); },
    atKw: function (v) { return this.at('kw', v); },
    next: function () { return this.t[this.p++]; },
    line: function () { var tk = this.t[this.p]; return tk ? tk.line : null; },
    accept: function (type, value) { return this.at(type, value) ? this.next() : null; },
    expect: function (type, value, hint) {
      if (this.at(type, value)) return this.next();
      var tk = this.t[this.p] || { line: '?', value: '文件末尾' };
      var got = tk.type === 'newline' ? '换行' :
                tk.type === 'dedent' ? '语句块结束' :
                tk.type === 'eof' ? '文件末尾' : '"' + tk.value + '"';
      throw perr('SyntaxError',
        '第 ' + tk.line + '行:' + (hint || ('这里应该是 ' + (value !== undefined ? '"' + value + '"' : type) +
        ',但实际读到 ' + got)) + '。',
        tk.line);
    },
    skipNewlines: function () { while (this.at('newline')) this.next(); },
    srcOf: function (ln) { return (this.lines[ln - 1] || '').trim(); },

    /* --- 入口 --- */
    parseProgram: function () {
      var body = this.parseBlock(0);
      if (!this.at('eof')) {
        var tk = this.peek();
        throw perr('SyntaxError', '第 ' + tk.line + '行:多余的 "' + tk.value + '",这一行无法解析。', tk.line);
      }
      return body;
    },
    parseBlock: function (baseIndent) {
      var body = [];
      this.skipNewlines();
      while (!this.at('eof') && !this.at('dedent')) {
        var st = this.parseStatement();
        if (st) body.push(st);
        this.skipNewlines();
      }
      return body;
    },
    parseSuite: function (headLine) {
      // 冒号之后的代码块:换行 + INDENT ... DEDENT
      if (this.at('newline')) {
        this.next();
        if (!this.accept('indent')) {
          var tk = this.peek();
          throw perr('IndentationError',
            '第 ' + headLine + '行:这里需要一个缩进的代码块(下一行要向右缩进 4 个空格)。', headLine);
        }
        var body = this.parseBlock(0);
        this.accept('dedent');
        if (!body.length) throw perr('IndentationError', '第 ' + headLine + '行:冒号后面必须有语句。', headLine);
        return body;
      }
      // 单行写法: if x > 1: print(x)
      var st = this.parseStatement();
      return [st];
    },

    /* --- 语句 --- */
    parseStatement: function () {
      var tk = this.peek(), ln = tk.line;
      if (tk.type === 'kw') {
        switch (tk.value) {
          case 'if':    return this.parseIf();
          case 'while': return this.parseWhile();
          case 'for':   return this.parseFor();
          case 'def':   return this.parseFuncDef();
          case 'class': return this.parseClassDef();
          case 'try':   return this.parseTry();
          case 'return':
            this.next();
            var rv = this.at('newline') ? null : this.parseExprList();
            return { type: 'Return', value: rv, line: ln };
          case 'break':    this.next(); return { type: 'Break', line: ln };
          case 'continue': this.next(); return { type: 'Continue', line: ln };
          case 'pass':     this.next(); return { type: 'Pass', line: ln };
          case 'import':   return this.parseImport();
          case 'from':     return this.parseFromImport();
          case 'global':   this.next();
            var gs = []; do { gs.push(this.expect('name', undefined, 'global 后面要写变量名').value); } while (this.accept('op', ','));
            return { type: 'Global', names: gs, line: ln };
          case 'raise':
            this.next();
            var ex = this.at('newline') ? null : this.parseExpr();
            return { type: 'Raise', exc: ex, line: ln };
          case 'with': {
            /* [修订] 支持 with 表达式 as 名字: —— 离开缩进块时自动 close() */
            this.next();
            var wctx = this.parseExpr(), wname = null;
            if (this.atKw('as')) { this.next(); wname = this.expect('name', undefined, 'as 后面要写一个变量名').value; }
            this.expect('op', ':', 'with 语句末尾必须有英文冒号');
            return { type: 'With', ctx: wctx, name: wname, body: this.parseSuite(ln), line: ln };
          }
        }
      }
      return this.parseSimpleStatement();
    },

    parseSimpleStatement: function () {
      var ln = this.line();
      var target = this.parseExpr();
      var tk = this.peek();

      // 元组赋值目标:a, b = 1, 2  /  a, b = b, a
      // * 必须在「增强赋值」之前判断,否则会把逗号当成表达式末尾
      if (tk.type === 'op' && tk.value === ',' && target.type === 'Name') {
        var items = [target];
        while (this.accept('op', ',')) {
          if (this.atOp('=') || this.at('newline') || this.at('eof')) break;
          var t2 = this.parseExpr();
          if (t2.type !== 'Name' && t2.type !== 'Attr' && t2.type !== 'Subscript' && t2.type !== 'Tuple') {
            return { type: 'Expr', value: this.parseExprListFrom(items[0]), line: ln };
          }
          items.push(t2);
        }
        if (this.atOp('=')) {
          var tgt = { type: 'Tuple', items: items, line: ln };
          this.next();
          var rhs1 = this.parseExpr();
          return { type: 'Assign', targets: [tgt], value: this.parseExprListFrom(rhs1), line: ln };
        }
        // 不是赋值,那就只是表达式里的一串逗号(退化成元组表达式)
        return { type: 'Expr', value: { type: 'Tuple', items: items, line: ln }, line: ln };
      }

      // 增强赋值
      if (tk.type === 'op' && /^(\+=|-=|\*=|\/=|\/\/=|%=|\*\*=)$/.test(tk.value)) {
        this.next();
        var val = this.parseExprList();
        return { type: 'AugAssign', target: target, op: tk.value.slice(0, -1), value: val, line: ln };
      }
      // 普通赋值(可能链式 a = b = 1)
      if (tk.type === 'op' && tk.value === '=') {
        var targets = [target];
        while (this.accept('op', '=')) {
          var rhs = this.parseExpr();
          if (this.atOp('=')) { targets.push(rhs); continue; }
          return { type: 'Assign', targets: targets, value: this.parseExprListFrom(rhs), line: ln };
        }
      }
      // 否则是表达式语句
      return { type: 'Expr', value: target, line: ln };
    },
    parseExprListFrom: function (first) {
      var items = [first];
      while (this.atOp(',')) { this.next(); if (this.at('newline') || this.at('eof')) break; items.push(this.parseExpr()); }
      return items.length === 1 ? first : { type: 'Tuple', items: items, line: first.line };
    },
    parseExprList: function () {
      var first = this.parseExpr();
      return this.parseExprListFrom(first);
    },
    /**
     * 解析 for 语句的目标列表 / 赋值目标。
     * [!] 这里**故意不用 parseExpr**:因为 parseExpr 会走到 parseComparison,
     *    把 `in` 当成比较运算符消费掉,导致 `for i in range(3):` 被解析成
     *    表达式 `i in range(3)`,然后报「少了 in」。
     *    目标只能是「原子」:变量名 / 属性 / 下标 / 括号或逗号组成的元组目标。
     */
    parseTargetAtom: function () {
      if (this.atOp('(') || this.atOp('[')) {
        var close = this.atOp('(') ? ')' : ']';
        this.next();
        var items = [this.parseTargetAtom()];
        while (this.accept('op', ',')) {
          if (this.atOp(close)) break;
          items.push(this.parseTargetAtom());
        }
        this.expect('op', close);
        return { type: 'Tuple', items: items, line: items[0].line };
      }
      var node = { type: 'Name', id: this.expect('name', undefined, '这里要写变量名').value, line: this.line() };
      // 允许 a.b 与 a[0] 作为赋值目标
      for (;;) {
        if (this.atOp('.')) {
          this.next();
          var nm = this.peek();
          if (nm.type !== 'name' && nm.type !== 'kw') {
            throw perr('SyntaxError', '第 ' + nm.line + '行:点号 . 后面要跟属性名。', nm.line);
          }
          this.next();
          node = { type: 'Attr', obj: node, name: nm.value, line: nm.line };
        } else if (this.atOp('[')) {
          var ln2 = this.line();
          this.next();
          var idx = this.parseExpr();
          this.expect('op', ']');
          node = { type: 'Subscript', obj: node, index: idx, isSlice: false, line: ln2 };
        } else break;
      }
      return node;
    },
    parseTargetList: function () {
      var items = [this.parseTargetAtom()];
      while (this.atOp(',')) {
        this.next();
        if (this.atOp('=') || this.atOp('in') || this.atOp(':')) break;
        items.push(this.parseTargetAtom());
      }
      return items;
    },

    parseIf: function () {
      var ln = this.next().line;
      var cond = this.parseExpr();
      this.expect('op', ':', 'if 条件后面必须有一个英文冒号');
      var body = this.parseSuite(ln);
      var branches = [{ cond: cond, body: body, line: ln }];
      var orelse = [];
      for (;;) {
        this.skipNewlines();
        if (this.atKw('elif')) {
          var l2 = this.next().line;
          var c2 = this.parseExpr();
          this.expect('op', ':', 'elif 条件后面必须有一个英文冒号');
          branches.push({ cond: c2, body: this.parseSuite(l2), line: l2 });
          continue;
        }
        if (this.atKw('else')) {
          var l3 = this.next().line;
          this.expect('op', ':', 'else 后面必须有一个英文冒号');
          orelse = this.parseSuite(l3);
        }
        break;
      }
      return { type: 'If', branches: branches, orelse: orelse, line: ln };
    },

    parseWhile: function () {
      var ln = this.next().line;
      var cond = this.parseExpr();
      this.expect('op', ':', 'while 条件后面必须有一个英文冒号');
      return { type: 'While', cond: cond, body: this.parseSuite(ln), line: ln };
    },

    parseFor: function () {
      var ln = this.next().line;
      var targets = this.parseTargetList();
      if (!this.atKw('in')) {
        throw perr('SyntaxError', '第 ' + ln + '行:for 循环的写法是 「for 变量 in 序列:」,这里少了 in。', ln);
      }
      this.next();
      var iter = this.parseExpr();
      this.expect('op', ':', 'for 语句末尾必须有一个英文冒号');
      return { type: 'For', targets: targets, iter: iter, body: this.parseSuite(ln), line: ln };
    },

    parseFuncDef: function () {
      var ln = this.next().line;
      var nameTok = this.expect('name', undefined, 'def 后面要写函数名');
      this.expect('op', '(', '函数名后面必须紧跟英文小括号 (');
      var params = this.parseParams();
      this.expect('op', ':', 'def 函数名(参数) 后面必须有一个英文冒号');
      return { type: 'FuncDef', name: nameTok.value, params: params, body: this.parseSuite(ln), line: ln };
    },
    parseParams: function () {
      var params = [];
      while (!this.atOp(')')) {
        if (this.atOp('*') || this.atOp('**')) {
          throw perr('UnsupportedFeature', '本教学模拟器暂不支持 *args / **kwargs,请用普通参数。', this.line());
        }
        var pn = this.expect('name', undefined, '参数应该是变量名').value;
        var def = null;
        if (this.accept('op', '=')) def = this.parseExpr();
        params.push({ name: pn, def: def });
        if (!this.accept('op', ',')) break;
      }
      this.expect('op', ')', '参数列表要用英文小括号 ) 收尾');
      return params;
    },

    parseClassDef: function () {
      var ln = this.next().line;
      var nameTok = this.expect('name', undefined, 'class 后面要写类名');
      var bases = [];
      if (this.accept('op', '(')) {
        while (!this.atOp(')')) { bases.push(this.parseExpr()); this.accept('op', ','); }
        this.expect('op', ')');
      }
      this.expect('op', ':', 'class 类名 后面必须有一个英文冒号');
      return { type: 'ClassDef', name: nameTok.value, bases: bases, body: this.parseSuite(ln), line: ln };
    },

    parseTry: function () {
      var ln = this.next().line;
      this.expect('op', ':', 'try 后面必须有一个英文冒号');
      var body = this.parseSuite(ln);
      var handlers = [], finalbody = [];
      for (;;) {
        this.skipNewlines();
        if (this.atKw('except')) {
          var l2 = this.next().line;
          var excType = null, asName = null;
          if (!this.atOp(':')) {
            excType = this.parseExpr();
            if (this.atKw('as')) { this.next(); asName = this.expect('name').value; }
          }
          this.expect('op', ':', 'except 后面必须有英文冒号');
          handlers.push({ type: excType, name: asName, body: this.parseSuite(l2), line: l2 });
          continue;
        }        if (this.atKw('finally')) {
          var l3 = this.next().line;
          this.expect('op', ':', 'finally 后面必须有英文冒号');
          finalbody = this.parseSuite(l3);
        }
        break;
      }
      if (!handlers.length && !finalbody.length) {
        throw perr('SyntaxError', '第 ' + ln + '行:try 后面需要跟 except 或 finally。', ln);
      }
      return { type: 'Try', body: body, handlers: handlers, finalbody: finalbody, line: ln };
    },

    parseImport: function () {
      var ln = this.next().line;
      var names = [];
      do {
        var mod = this.expect('name', undefined, 'import 后面要写模块名').value;
        var alias = null;
        if (this.atKw('as')) { this.next(); alias = this.expect('name').value; }
        names.push({ mod: mod, alias: alias });
      } while (this.accept('op', ','));
      return { type: 'Import', names: names, line: ln };
    },
    parseFromImport: function () {
      var ln = this.next().line;
      var mod = this.expect('name', undefined, 'from 后面要写模块名').value;
      if (!this.atKw('import')) throw perr('SyntaxError', '第 ' + ln + '行:from ' + mod + '后面需要 import。', ln);
      this.next();
      if (this.atOp('*')) {
        throw perr('UnsupportedFeature', '第 ' + ln + '行:本教学模拟器不支持 from ... import *,请写具体名字,例如 from math import sqrt。', ln);
      }
      var names = [];
      do {
        var nm = this.expect('name', undefined, '要导入的名字').value;
        var alias = null;
        if (this.atKw('as')) { this.next(); alias = this.expect('name').value; }
        names.push({ name: nm, alias: alias });
      } while (this.accept('op', ','));
      return { type: 'FromImport', mod: mod, names: names, line: ln };
    },

    /* --- 表达式(优先级从低到高) --- */
    /**
     * 表达式入口。
     * Python 里优先级最低的是「条件表达式」:A if 条件 else B
     * 它低于 or/and/not/比较,所以放在最外层先判断。
     */
    parseExpr: function () {
      var body = this.parseOr();
      if (this.atKw('if')) {
        var ln = this.line();
        this.next();
        var cond = this.parseOr();
        if (!this.atKw('else')) {
          throw perr('SyntaxError',
            '第 ' + this.line() + '行:条件表达式写成「A if 条件 else B」,这里少了 else。', this.line());
        }
        this.next();
        var orelse = this.parseExpr();
        return { type: 'IfExp', cond: cond, body: body, orelse: orelse, line: ln };
      }
      return body;
    },

    parseOr: function () {
      var left = this.parseAnd();
      while (this.atKw('or')) {
        var ln = this.next().line;
        left = { type: 'BoolOp', op: 'or', left: left, right: this.parseAnd(), line: ln };
      }
      return left;
    },
    parseAnd: function () {
      var left = this.parseNot();
      while (this.atKw('and')) {
        var ln = this.next().line;
        left = { type: 'BoolOp', op: 'and', left: left, right: this.parseNot(), line: ln };
      }
      return left;
    },
    parseNot: function () {
      if (this.atKw('not')) {
        var ln = this.next().line;
        return { type: 'UnaryOp', op: 'not', operand: this.parseNot(), line: ln };
      }
      return this.parseComparison();
    },
    parseComparison: function () {
      var left = this.parseBitOr();
      var ops = [], comps = [];
      for (;;) {
        var v = null;
        if (this.atOp('==')) v = '==';
        else if (this.atOp('!=')) v = '!=';
        else if (this.atOp('<=')) v = '<=';
        else if (this.atOp('>=')) v = '>=';
        else if (this.atOp('<')) v = '<';
        else if (this.atOp('>')) v = '>';
        else if (this.atKw('in')) v = 'in';
        else if (this.atKw('not') && this.peek(1) && this.peek(1).value === 'in' && this.peek(1).type === 'kw') v = 'not in';
        else if (this.atKw('is')) v = 'is';
        if (!v) break;
        var ln = this.line();
        if (v === 'not in') { this.next(); this.next(); } else { this.next(); }
        ops.push(v); comps.push(this.parseBitOr());
      }
      if (!ops.length) return left;
      return { type: 'Compare', left: left, ops: ops, comparators: comps, line: left.line };
    },
    /* [修订] | ^ & 三层(优先级与 Python 相同),主要供集合的并/对称差/交使用 */
    parseBitOr: function () {
      var left = this.parseBitXor();
      while (this.atOp('|')) { this.next(); left = { type: 'BinOp', op: '|', left: left, right: this.parseBitXor(), line: left.line }; }
      return left;
    },
    parseBitXor: function () {
      var left = this.parseBitAnd();
      while (this.atOp('^')) { this.next(); left = { type: 'BinOp', op: '^', left: left, right: this.parseBitAnd(), line: left.line }; }
      return left;
    },
    parseBitAnd: function () {
      var left = this.parseArith();
      while (this.atOp('&')) { this.next(); left = { type: 'BinOp', op: '&', left: left, right: this.parseArith(), line: left.line }; }
      return left;
    },
    parseArith: function () {
      var left = this.parseTerm();
      while (this.atOp('+') || this.atOp('-')) {
        var op = this.next().value;
        left = { type: 'BinOp', op: op, left: left, right: this.parseTerm(), line: left.line };
      }
      return left;
    },
    parseTerm: function () {
      var left = this.parseUnary();
      while (this.atOp('*') || this.atOp('/') || this.atOp('//') || this.atOp('%')) {
        var op = this.next().value;
        left = { type: 'BinOp', op: op, left: left, right: this.parseUnary(), line: left.line };
      }
      return left;
    },
    parseUnary: function () {
      if (this.atOp('-') || this.atOp('+')) {
        var op = this.next().value;
        return { type: 'UnaryOp', op: op, operand: this.parseUnary(), line: this.line() };
      }
      return this.parsePower();
    },
    parsePower: function () {
      var base = this.parsePostfix();
      if (this.atOp('**')) {
        this.next();
        return { type: 'BinOp', op: '**', left: base, right: this.parseUnary(), line: base.line };
      }
      return base;
    },
    parsePostfix: function () {
      var node = this.parseAtom();
      for (;;) {
        if (this.atOp('.')) {
          this.next();
          var nm = this.peek();
          if (nm.type !== 'name' && nm.type !== 'kw') {
            throw perr('SyntaxError', '第 ' + nm.line + '行:点号 . 后面要跟属性名。', nm.line);
          }
          this.next();
          node = { type: 'Attr', obj: node, name: nm.value, line: nm.line };
        } else if (this.atOp('(')) {
          var ln = this.line();
          this.next();
          var args = [], kwargs = {};
          while (!this.atOp(')')) {
            // 关键字参数
            if (this.peek().type === 'name' && this.peek(1) && this.peek(1).type === 'op' && this.peek(1).value === '=') {
              var kn = this.next().value; this.next();
              kwargs[kn] = this.parseExpr();
            } else {

  global.__DATASETS_TO_PY__ = function (interp, api) {

    attrs.csv_text = DATASETS.csvSample;
    attrs.note = '内置真实数据集:城市 / 监测站 / 省界 / 气温序列 / 空间网格';

# -*- coding: utf-8 -*-
